// ─── Word 파일 생성 (브라우저) ──────────────────────
function generateWordFile(generatedHtml, data, planType) {
  const { Document: Doc, Packer: Pk, Paragraph: Para, TextRun: TR, AlignmentType: AT, PageBreak: PB } = docx;
  const FONT = "맑은 고딕";

  // HTML → 텍스트 변환 (테이블은 마커로 보존)
  let html = generatedHtml;
  const tables = [];
  html = html.replace(/<\/pre><div[^>]*>.*?<table[^>]*>([\s\S]*?)<\/table>.*?<\/div><pre[^>]*>/g, (m, tc) => {
    const tableData = []; const rm = tc.match(/<tr>([\s\S]*?)<\/tr>/g) || [];
    for (const r of rm) { const cells = []; const cm = r.match(/<td[^>]*>([\s\S]*?)<\/td>/g) || []; for (const c of cm) cells.push(c.replace(/<[^>]+>/g, "").trim()); tableData.push(cells); }
    const idx = tables.length; tables.push(tableData);
    return "\n\n__TABLE_" + idx + "__\n";
  });
  const tmp = document.createElement("div"); tmp.innerHTML = html;
  const text = tmp.textContent || tmp.innerText || "";
  const lines = text.split("\n");

  // 제목/회사명 추출
  const titleMap2 = { DC: "확정기여형 퇴직연금 규약", DB: "확정급여형 퇴직연금 규약", HY: "혼합형 퇴직연금 규약" };
  const regTitle = titleMap2[planType];
  const companyName = data.companyName || "(주)○○○○";
  const sf = data.startDate ? (()=>{const p=data.startDate.split("-");return p[0]+". "+parseInt(p[1])+".";})() : new Date().getFullYear() + ".";

  // 표지
  const coverChildren = [];
  for (let i = 0; i < 7; i++) coverChildren.push(new Para({ spacing: { before: 200, after: 200 }, children: [] }));
  coverChildren.push(new Para({ alignment: AT.CENTER, spacing: { before: 100, after: 100, line: 480 }, children: [new TR({ text: regTitle, font: FONT, size: 64, bold: true })] }));
  coverChildren.push(new Para({ spacing: { before: 600 }, children: [] }));
  coverChildren.push(new Para({ alignment: AT.CENTER, spacing: { before: 200, after: 200 }, children: [new TR({ text: sf, font: FONT, size: 28 })] }));
  coverChildren.push(new Para({ spacing: { before: 200 }, children: [] }));
  coverChildren.push(new Para({ alignment: AT.CENTER, spacing: { before: 200, after: 200 }, children: [new TR({ text: companyName, font: FONT, size: 48, bold: true })] }));

  // 본문 파싱
  const bodyChildren = [];
  for (const raw of lines) {
    const line = raw.trimEnd();
    const trimmed = line.trim();
    if (!trimmed) continue;

    // 규약 제목/회사명 스킵 (표지에 있으므로)
    if (trimmed.match(/퇴직연금제도규약$/) || trimmed === companyName) continue;

    // 장 제목
    if (trimmed.match(/^제\d+장\s/)) {
      bodyChildren.push(new Para({ alignment: AT.CENTER, spacing: { before: 480, after: 200, line: 360 }, children: [new TR({ text: trimmed, font: FONT, size: 26, bold: true })] }));
      continue;
    }

    // 부칙 제목 (페이지 바꿈)
    if (trimmed.match(/^【부\s*칙/)) {
      bodyChildren.push(new Para({ pageBreakBefore: true, spacing: { before: 200, after: 200, line: 360 }, alignment: AT.CENTER, children: [new TR({ text: trimmed, font: FONT, size: 24, bold: true })] }));
      continue;
    }

    // 별지 헤더 (페이지 바꿈)
    if (trimmed.match(/^\[별지\]/)) {
      bodyChildren.push(new Para({ pageBreakBefore: true, spacing: { before: 200, after: 120, line: 360 }, children: [new TR({ text: trimmed, font: FONT, size: 22, bold: true })] }));
      continue;
    }

    // 조 제목 (제N조(~))
    if (trimmed.match(/^제\d+조(?:의\d+)?\(/)) {
      const m = trimmed.match(/^(제\d+조(?:의\d+)?\([^)]+\))\s*(.*)/);
      if (m) {
        const runs = [new TR({ text: m[1] + " ", font: FONT, size: 22, bold: true })];
        if (m[2]) runs.push(new TR({ text: m[2], font: FONT, size: 22 }));
        bodyChildren.push(new Para({ spacing: { before: 280, after: 60, line: 360 }, children: runs }));
      }
      continue;
    }

    // 항 (①②③...)
    if (trimmed.match(/^[①②③④⑤⑥⑦⑧⑨⑩]/)) {
      bodyChildren.push(new Para({ spacing: { before: 60, after: 60, line: 360 }, indent: { left: 200 }, children: [new TR({ text: trimmed, font: FONT, size: 22 })] }));
      continue;
    }

    // 호 (1. 2. 3.)
    if (trimmed.match(/^\d+(?:의\d+)?[\.\s]/)) {
      bodyChildren.push(new Para({ spacing: { before: 40, after: 40, line: 360 }, indent: { left: 500 }, children: [new TR({ text: trimmed, font: FONT, size: 22 })] }));
      continue;
    }

    // 목 (가. 나. 다.)
    if (trimmed.match(/^[가나다라마바사아자차카타파하]\./)) {
      bodyChildren.push(new Para({ spacing: { before: 30, after: 30, line: 360 }, indent: { left: 800 }, children: [new TR({ text: trimmed, font: FONT, size: 22 })] }));
      continue;
    }

    // 주석 (※, ☞)
    if (trimmed.match(/^※|^☞/)) {
      bodyChildren.push(new Para({ spacing: { before: 60, after: 60, line: 360 }, indent: { left: 400 }, children: [new TR({ text: trimmed, font: FONT, size: 20, italics: true, color: "666666" })] }));
      continue;
    }

    // 납입비율 표 관련
    if (trimmed.match(/^<납입|^＜납입/)) {
      bodyChildren.push(new Para({ spacing: { before: 160, after: 80, line: 360 }, indent: { left: 400 }, children: [new TR({ text: trimmed, font: FONT, size: 22, bold: true })] }));
      continue;
    }

    // 납입비율 표 (Word 테이블)
    if (trimmed.match(/^__TABLE_\d+__$/)) {
      const idx = parseInt(trimmed.match(/\d+/)[0]);
      const tableData = tables[idx];
      if (tableData && tableData.length > 0) {
        const { Table: Tbl, TableRow: TRow, TableCell: TCell, BorderStyle: BS, WidthType: WT, ShadingType: ShT } = docx;
        const bdr = { style: BS.SINGLE, size: 1, color: "999999" };
        const borders = { top: bdr, bottom: bdr, left: bdr, right: bdr };
        const colCount = tableData[0].length;
        const colW = Math.floor(9000 / colCount);
        const rows = tableData.map((row, ri) => new TRow({
          children: row.map(cell => new TCell({
            borders, width: { size: colW, type: WT.DXA },
            shading: ri === 0 ? { fill: "F3F4F6", type: ShT.CLEAR } : undefined,
            margins: { top: 60, bottom: 60, left: 100, right: 100 },
            children: [new Para({ alignment: AT.CENTER, spacing: { before: 20, after: 20 }, children: [new TR({ text: cell, font: FONT, size: 20, bold: ri === 0 })] })]
          }))
        }));
        bodyChildren.push(new Para({ spacing: { before: 120, after: 40 }, indent: { left: 400 }, children: [new TR({ text: "＜납입 비율＞", font: FONT, size: 22, bold: true })] }));
        bodyChildren.push(new Tbl({ width: { size: 9000, type: WT.DXA }, columnWidths: Array(colCount).fill(colW), rows }));
        bodyChildren.push(new Para({ spacing: { before: 40, after: 80 }, children: [] }));
      }
      continue;
    }

    // 납입비율 텍스트 헤더 스킵 (이미 테이블로 처리)
    if (trimmed.match(/^<납입|^＜납입/)) continue;

    // 일반 텍스트
    const indent = line.length - line.trimStart().length;
    bodyChildren.push(new Para({ spacing: { before: 40, after: 40, line: 360 }, indent: { left: Math.max(200, indent * 60) }, children: [new TR({ text: trimmed, font: FONT, size: 22 })] }));
  }

  const margin = { top: 1400, right: 1200, bottom: 1400, left: 1200 };
  const pageSize = { width: 11906, height: 16838 };
  const doc = new Doc({
    styles: { default: { document: { run: { font: FONT, size: 22 } } } },
    sections: [
      { properties: { page: { size: pageSize, margin } }, children: coverChildren },
      { properties: { page: { size: pageSize, margin } }, children: bodyChildren }
    ]
  });

  const typeNames2 = { DC: "DC형", DB: "DB형", HY: "혼합형" };
  Pk.toBlob(doc).then(blob => __saveDocx(blob, `${companyName}_${typeNames2[planType]}_퇴직연금규약.docx`));
}

function StepIndicator({current}) {
  return (<div style={S.stepIndicator}>{STEPS.map((s,i)=>(<div key={s} style={{display:"flex",alignItems:"center",gap:0}}><div style={{...S.stepDot,background:i<=current?"#5A2800":"#d1d5db",color:i<=current?"#fff":"#9ca3af",fontWeight:i===current?700:500}}>{i<current?"✓":i+1}</div><span style={{fontSize:11,fontWeight:i===current?700:400,color:i<=current?"#5A2800":"#9ca3af",marginLeft:4,marginRight:i<STEPS.length-1?2:0,whiteSpace:"nowrap"}}>{s}</span>{i<STEPS.length-1&&<div style={{width:20,height:1,background:i<current?"#5A2800":"#e5e7eb",margin:"0 2px"}}/>}</div>))}</div>);
}

// ─── Main App ───────────────────────────────────────
function App() {
  const [planType,setPlanType]=useState(null);
  const [step,setStep]=useState(0);
  const [data,setData]=useState({coverageType:"all",retroactive:"none",paymentCycle:"monthly",contributionRate:"12분의 1",extensionPeriod:"2month",educationDelegate:true,fiscalMonth:"12",contribMonth:"12",contribDay:"31",benefitType:"standard"});
  const [generated,setGenerated]=useState("");
  const [resultTab,setResultTab]=useState("summary");
  const [faqOpen,setFaqOpen]=useState(null);
  const preRef=useRef(null);
  const set=(k,v)=>setData(p=>({...p,[k]:v}));
  const allOps=[...(data.operationManagers||[]),...(data.operationManagersBanks||[]),...(data.operationManagersIns||[])];
  const allAssets=[...(data.assetManagers||[]),...(data.assetManagersBanks||[]),...(data.assetManagersIns||[])];
  const canProceed=()=>{
    if(step===0) return data.companyName&&data.bizNo&&data.ceoName&&data.industry&&data.employeeCount&&data.address;
    if(step===1&&planType==="DC") return data.contributionRate!=="기타";
    if(step===1&&planType==="HY") return data.contributionRate!=="기타"&&data.dbRatio&&data.dcRatio&&(Number(data.dbRatio)+Number(data.dcRatio))>=100;
    if(step===2&&planType==="HY"){const dbo=[...(data.dbOperationManagers||[]),...(data.dbOperationManagersBanks||[]),...(data.dbOperationManagersIns||[])];const dco=[...(data.dcOperationManagers||[]),...(data.dcOperationManagersBanks||[]),...(data.dcOperationManagersIns||[])];const dba=[...(data.dbAssetManagers||[]),...(data.dbAssetManagersBanks||[]),...(data.dbAssetManagersIns||[])];const dca=[...(data.dcAssetManagers||[]),...(data.dcAssetManagersBanks||[]),...(data.dcAssetManagersIns||[])];return dbo.length>0&&dco.length>0&&dba.length>0&&dca.length>0&&(dbo.length<=1||data.dbLeadProvider);}
    if(step===2) return allOps.length>0&&allAssets.length>0&&(planType!=="DB"||allOps.length<=1||data.leadProvider);
    if(step===3) return data.startDate;
    return true;
  };
  const handleNext=()=>{if(step<4){if(step===3)setGenerated(planType==="DC"?generateDC(data):planType==="DB"?generateDB(data):generateHY(data));setStep(step+1);}};
  const handleCopy=()=>{
    // Convert HTML tables to text before extracting
    let html=generated;
    html=html.replace(/<\/pre><div[^>]*>.*?<table[^>]*>([\s\S]*?)<\/table>.*?<\/div><pre[^>]*>/g,(match,tc)=>{
      let rows=[];const rm=tc.match(/<tr>([\s\S]*?)<\/tr>/g)||[];
      for(const r of rm){const cells=[];const cm=r.match(/<td[^>]*>([\s\S]*?)<\/td>/g)||[];for(const c of cm)cells.push(c.replace(/<[^>]+>/g,"").trim());rows.push("      "+cells.join("\t"));}
      return "\n\n    <납입 비율>\n"+rows.join("\n")+"\n";
    });
    const tmp=document.createElement("div");tmp.innerHTML=html;
    navigator.clipboard.writeText(tmp.textContent||tmp.innerText||"").catch(()=>{});
  };

  if(!planType) return <TypeSelect onSelect={setPlanType} />;
  const titleMap={DC:"확정기여형",DB:"확정급여형",HY:"혼합형"};
  const typeLabel={DC:"DC",DB:"DB",HY:"혼합"};
  const typeLabelFull={DC:"DC",DB:"DB",HY:"혼합형"};
  const headerIconStyle=planType==="HY"?{...S.headerIcon,fontSize:11,letterSpacing:0,whiteSpace:"nowrap"}:S.headerIcon;

  return (
    <div style={S.root}>
      <div style={S.header}>
        <div style={headerIconStyle}>{typeLabelFull[planType]}</div>
        <div>
          <h1 style={S.headerTitle}>{titleMap[planType]} 퇴직연금 규약 자동생성</h1>
          <p style={S.headerSub}>근로자퇴직급여 보장법 기반 · {typeLabel[planType]}형 표준규약</p>
        </div>
      </div>
      <StepIndicator current={step} />
      <div style={S.body}>
        {step===0&&<Step1 data={data} set={set}/>}
        {step===1&&planType==="DC"&&<Step2DC data={data} set={set}/>}
        {step===1&&planType==="DB"&&<Step2DB data={data} set={set}/>}
        {step===1&&planType==="HY"&&<Step2HY data={data} set={set}/>}
        {step===2&&<Step3 data={data} set={set} planType={planType}/>}
        {step===3&&<Step4 data={data} set={set} planType={planType}/>}
        {step===4&&(
          <div style={S.stepContent}>
            <h2 style={S.stepTitle}>{typeLabel[planType]}형 규약 생성 완료</h2>
            <div style={S.complianceCard}>
              <h3 style={S.complianceTitle}>근퇴법 적합성 검증 ({typeLabel[planType]}형)</h3>
              {complianceChecks(data,planType).map((c,i)=>(<div key={i} style={S.checkRow}><span style={{color:c.ok?"#059669":"#dc2626",marginRight:8,fontSize:16}}>{c.ok?"✓":"✗"}</span><span style={{color:c.ok?"#1f2937":"#dc2626"}}>{c.label}</span></div>))}
            </div>
            <div style={S.tabBar}>
              {[{id:"summary",label:"핵심 요약"},{id:"full",label:"규약 전문"},{id:"faq",label:"자주 묻는 질문"},{id:"next",label:"NEXT STEP"}].map(t=>(
                <button key={t.id} style={{...S.tabBtn,...(resultTab===t.id?S.tabActive:{})}} onClick={()=>setResultTab(t.id)}>{t.label}</button>
              ))}
            </div>
            {resultTab==="summary"&&(
              <div style={S.tabContent}>
                {generateSummary(data,planType).map((sec,si)=>(
                  <div key={si} style={{marginBottom:16}}>
                    <div style={S.summarySectionTitle}>{sec.section}</div>
                    <div>{sec.items.map((it,ii)=>(<div key={ii} style={S.summaryRow}><span style={S.summaryKey}>{it.k}</span><span style={S.summaryValue}>{it.v}</span></div>))}</div>
                  </div>
                ))}
              </div>
            )}
            {resultTab==="full"&&(
              <div style={S.tabContent}>
                <p style={{fontSize:12,color:"#6b7280",marginBottom:10}}>입력값이 <span class="hl">회색 배경</span>으로 표시되어 있습니다.</p>
                <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
                  <button style={S.copyBtn} onClick={handleCopy}>규약 전문 복사</button>
                  <button style={{...S.copyBtn,background:"#1e40af"}} onClick={()=>generateWordFile(generated,data,planType)}>Word 다운로드 (.docx)</button>
                  <button style={{...S.copyBtn,background:"#065f46"}} onClick={()=>generateSingoWord(data,planType)}>신고서 다운로드 (.docx)</button>
                  <button style={{...S.copyBtn,background:"#6b7280"}} onClick={()=>{window.__copyMode=true;generateWordFile(generated,data,planType)}}>규약 서식 복사 (Word 붙여넣기용)</button>
                </div>
                <div style={S.regulationBox}><pre style={S.regulationText} dangerouslySetInnerHTML={{__html:generated}} /></div>
              </div>
            )}
            {resultTab==="faq"&&(
              <div style={S.tabContent}>
                <p style={{fontSize:12,color:"#6b7280",marginBottom:14}}>이 규약의 설정값을 기반으로 자동 생성된 Q&A입니다.</p>
                {generateFAQ(data,planType).map((item,i)=>(
                  <div key={i} style={{marginBottom:6}}>
                    <button style={S.faqQuestion} onClick={()=>setFaqOpen(faqOpen===i?null:i)}>
                      <span style={{flex:1,textAlign:"left"}}>{item.q}</span>
                      <span style={{fontSize:11,color:"#9ca3af",marginLeft:8,flexShrink:0}}>{item.article}</span>
                      <span style={{marginLeft:8,fontSize:12,color:"#9ca3af",transform:faqOpen===i?"rotate(180deg)":"rotate(0)"}}>▼</span>
                    </button>
                    {faqOpen===i&&<div style={S.faqAnswer}>{item.a.split("\n").map((line,j)=><p key={j} style={{margin:j>0?"8px 0 0":0,...(line.startsWith("(수식)")?{fontStyle:"italic",color:"#6b7280",fontSize:12}:{}),minHeight:line.trim()===""?8:undefined}}>{line||"\u00A0"}</p>)}</div>}
                  </div>
                ))}
              </div>
            )}
            {resultTab==="chat"&&(
              <div style={S.tabContent}><ChatBot regulation={generated} data={data} planType={planType} /></div>
            )}
            {resultTab==="next"&&(
              <div style={S.tabContent}><NextStepTab data={data} planType={planType} /></div>
            )}
          </div>
        )}
      </div>
      {step<4&&(<div style={S.footer}>{step===0?<button style={S.backBtn} onClick={()=>setPlanType(null)}>← 제도 선택</button>:<button style={S.backBtn} onClick={()=>setStep(step-1)}>← 이전</button>}<div style={{flex:1}}/><button style={{...S.nextBtn,opacity:canProceed()?1:0.4}} disabled={!canProceed()} onClick={handleNext}>{step===3?"규약 생성하기":"다음 →"}</button></div>)}
      {step===4&&(<div style={S.footer}><button style={S.backBtn} onClick={()=>{setPlanType(null);setStep(0);}}>처음부터 다시</button><div style={{flex:1}}/></div>)}
    </div>
  );
}
