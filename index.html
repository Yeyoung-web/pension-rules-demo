<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>퇴직연금 규약 자동생성기</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/niceplugin/NanumBarunGothic/NanumBarunGothic.css');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; font-family: 'NanumBarunGothic','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
    input, select, textarea { color: #1f2937 !important; }
    input:focus, select:focus { border-color: #557DB9 !important; outline: none; }
    button:hover { opacity: 0.85; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
    .hl { background: #e8e8e8; padding: 1px 3px; border-radius: 3px; }
  </style>
  <script>
window.__dl=null;
(async()=>{try{if(window.claude&&window.claude.use){window.__dl=await window.claude.use("downloads");}}catch(e){}})();
async function __saveDocx(blob, filename){
  const name=(filename||"규약.docx").replace(/[\\/:*?"<>|]/g,"_");
  if(window.__copyMode){window.__copyMode=false;__showCopyFallback(blob,name);return;}
  if(!window.claude){const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);return;}
  if(window.__dl){
    try{await window.__dl.save({filename:name,data:blob});return;}
    catch(e){ window.__lastDlErr=(e&&e.code)||String(e); }
  }
  __showCopyFallback(blob,name);
}
async function __showCopyFallback(blob,name){
  let html="";
  try{const r=await mammoth.convertToHtml({arrayBuffer:await blob.arrayBuffer()});html=r.value;}catch(e){html="<p>문서를 불러오지 못했습니다.</p>";}
  const docHtml='<div style="font-family:\'맑은 고딕\',\'Malgun Gothic\',sans-serif;font-size:10pt;line-height:1.6">'+html.replace(/<table>/g,'<table border="1" style="border-collapse:collapse;width:100%">').replace(/<td>/g,'<td style="border:1px solid #444;padding:4px 6px;font-size:10pt">')+'</div>';
  const old=document.getElementById("__cpov");if(old)old.remove();
  const ov=document.createElement("div");ov.id="__cpov";
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px";
  ov.innerHTML='<div style="background:#fff;color:#111;border-radius:12px;max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;font-family:sans-serif">'+
   '<div style="padding:16px 20px;border-bottom:1px solid #eee"><div style="font-weight:700;font-size:16px;margin-bottom:6px">Word 파일 받기</div>'+
   '<div style="font-size:13px;color:#444;line-height:1.5">공유 링크에서는 파일 다운로드가 제한됩니다. 아래 <b>서식째 복사</b>를 누른 뒤 Word 새 문서에 붙여넣고(⌘V / Ctrl+V) <b>'+name.replace(/</g,"&lt;")+'</b>로 저장하세요. 조문·표·굵은 글씨가 그대로 옮겨집니다.</div>'+
   '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button id="__cpbtn" style="background:#1e40af;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer">서식째 복사</button>'+
   '<button id="__cpclose" style="background:#eee;border:0;border-radius:8px;padding:10px 16px;cursor:pointer">닫기</button><span id="__cpmsg" style="font-size:13px;align-self:center;color:#065f46"></span></div></div>'+
   '<div id="__cpdoc" style="overflow:auto;padding:20px 28px;background:#fafafa"></div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#__cpdoc").innerHTML=docHtml;
  ov.querySelector("#__cpclose").onclick=()=>ov.remove();
  ov.querySelector("#__cpbtn").onclick=async()=>{
    const msg=ov.querySelector("#__cpmsg");const box=ov.querySelector("#__cpdoc");
    let ok=false;
    try{
      const r=document.createRange();r.selectNodeContents(box);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
      ok=document.execCommand("copy");
    }catch(_){ok=false;}
    if(!ok){
      try{
        await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob(["<html><body>"+docHtml+"</body></html>"],{type:"text/html"}),"text/plain":new Blob([box.innerText],{type:"text/plain"})})]);
        ok=true;
      }catch(_){}
    }
    msg.textContent=ok?"복사됐습니다. Word에 붙여넣으세요. 안 붙여지면 아래 문서가 선택된 상태에서 ⌘C / Ctrl+C를 눌러 주세요.":"아래 문서가 선택됐습니다. ⌘C / Ctrl+C로 복사하세요.";
    if(!ok){const r=document.createRange();r.selectNodeContents(box);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);}
  };
}
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <script>
    // 코드 보호
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) e.preventDefault();
      if (e.key === 'F12') e.preventDefault();
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J' || e.key === 'c' || e.key === 'C')) e.preventDefault();
    });

  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useRef, useEffect } = React;

const STEPS = ["기업정보","제도설계","퇴직연금사업자","세부설정","규약생성"];
const INDUSTRY_OPTIONS = ["제조업","건설업","도·소매업","숙박·음식점업","운수·창고업","정보통신업","금융·보험업","부동산업","전문·과학·기술서비스업","교육서비스업","보건·사회복지서비스업","기타 서비스업"];
const SECURITIES = ["한국투자증권","미래에셋증권","현대차증권","아이엠증권","삼성증권","NH투자증권","신한투자증권","대신증권","KB증권","하나증권","신영증권","유안타증권","한화투자증권"];
const BANKS = ["KB국민은행","신한은행","우리은행","IBK기업은행","하나은행","NH농협은행","KDB산업은행","부산은행","경남은행","아이엠뱅크","광주은행","제주은행","전북은행"];
const INSURANCE = ["삼성생명","교보생명","삼성화재","한화생명","KB손해보험","미래에셋생명","동양생명","DB손해보험","현대해상","흥국생명","IBK연금보험","롯데손해보험","푸본현대생명","신한라이프","한화손해보험","하나생명"];

function formatBizNo(v) { const n=v.replace(/\D/g,"").slice(0,10); if(n.length<=3)return n; if(n.length<=5)return n.slice(0,3)+"-"+n.slice(3); return n.slice(0,3)+"-"+n.slice(3,5)+"-"+n.slice(5); }
function hl(v) { return `<span class="hl">${v}</span>`; }
function formatDate(d) { if(!d)return"0000년 00월 00일"; return d.replace(/-/g,".").replace(/(\d{4})\.(\d{2})\.(\d{2})/,"$1년 $2월 $3일"); }

function Field({label,required,children}){return(<div style={S.field}><label style={S.label}>{label}{required&&<span style={{color:"#e74c3c"}}> *</span>}</label>{children}</div>);}

// ─── 업종·규모별 스마트 추천 ────────────────────────
const SMART_RECS = {
  "제조업":{tip:"제조업은 생산직·사무직 혼재 시 '전체 근로자' 적용이 일반적입니다. 교대근무자의 임금 산정 시 야간수당 포함 여부를 확인하세요."},
  "건설업":{tip:"건설업은 현장 근로자 이직률이 높아 월 납입이 권장됩니다. 일용직은 별도 퇴직금 제도 적용 대상인지 확인하세요."},
  "도·소매업":{tip:"파트타임 근로자가 많은 경우 주 15시간 미만자 제외 조항이 실무적으로 중요합니다."},
  "숙박·음식점업":{tip:"계절 변동이 큰 업종이므로 월 납입 방식이 자금 관리에 유리합니다. 팁·봉사료는 임금총액 포함 여부를 확인하세요."},
  "정보통신업":{tip:"IT 기업은 스톡옵션 행사이익의 임금 해당 여부에 유의하세요. 소규모 스타트업은 임원 포함이 일반적입니다."},
  "금융·보험업":{tip:"성과급 비중이 높은 경우 부담금 산정 기준 임금의 범위를 명확히 규정하는 것이 중요합니다."},
  "전문·과학·기술서비스업":{tip:"소규모 전문직 법인은 대표·임원도 실질적 근로를 제공하는 경우가 많아 임원 포함을 검토하세요."},
  "교육서비스업":{tip:"학기제 계약직 강사의 경우 계속근로기간 1년 미만 제외 조항 적용에 유의하세요."},
  "보건·사회복지서비스업":{tip:"3교대 근무가 일반적이므로 야간근로수당 등이 임금총액에 정확히 반영되어야 합니다."},
};
function getRec(industry,count){const n=Number(count)||0;const base=SMART_RECS[industry];if(!base)return null;const rec={...base};
  if(n<10) rec.sizeNote="10인 미만 소규모 사업장입니다. 운용관리·자산관리기관을 동일 기관으로 선정하면 관리가 편리합니다.";
  else if(n<30) rec.sizeNote="10~29인 사업장입니다. 대부분 전체 근로자를 가입대상으로 합니다.";
  else if(n<100) rec.sizeNote="30~99인 사업장입니다. 근로자대표 선정 절차를 사전에 확인하세요.";
  else if(n<300) rec.sizeNote="100~299인 사업장입니다. 복수 퇴직연금사업자 선정을 통한 경쟁 구도 확보를 권장합니다.";
  else rec.sizeNote="300인 이상 사업장입니다. 퇴직연금사업자 선정·변경 사유서(별지) 작성이 의무입니다.";
  return rec;
}
function SmartRec({industry,count}) {
  const rec=getRec(industry,count); if(!rec) return null;
  return (<div style={S.recBox}>
    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}><span style={{fontSize:16}}>💡</span><span style={{fontSize:13,fontWeight:700,color:"#3730a3"}}>업종·규모 기반 추천</span></div>
    <p style={{fontSize:12,color:"#4338ca",margin:0,lineHeight:1.6}}>{rec.tip}</p>
    {rec.sizeNote&&<p style={{fontSize:12,color:"#4338ca",margin:0,lineHeight:1.6,marginTop:6,paddingTop:6,borderTop:"1px solid #e0e7ff"}}>{rec.sizeNote}</p>}
  </div>);
}

// ─── Type Selection ─────────────────────────────────
function TypeSelect({onSelect}) {
  return (
    <div style={{...S.root,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",padding:"40px"}}>
      <h1 style={{fontSize:22,fontWeight:800,color:"#5A2800",marginBottom:6}}>퇴직연금 규약 자동생성</h1>
      <p style={{fontSize:13,color:"#6b7280",marginBottom:36}}>근로자퇴직급여 보장법 기반 · 중소기업 디지털 가입 지원</p>
      <div style={{display:"flex",gap:16,width:"100%",maxWidth:560}}>
        {[{type:"DC",line1:"확정기여형",line2:"DC형"},
          {type:"DB",line1:"확정급여형",line2:"DB형"},
          {type:"HY",line1:"혼합형",line2:"DB+DC"}
        ].map(item=>(
          <button key={item.type} onClick={()=>onSelect(item.type)} style={S.typeCard}>
            <div style={{fontSize:15,fontWeight:800,color:"#5A2800",lineHeight:1.6}}>{item.line1}<br/>{item.line2}</div>
          </button>
        ))}
      </div>
      <div style={{display:"flex",gap:16,width:"100%",maxWidth:560,marginTop:12}}>
        <p style={{flex:1,fontSize:12,color:"#6b7280",lineHeight:1.5,textAlign:"center"}}>근로자가 적립금 운용방법을 선택. 부담금은 연간 임금총액의 1/12 이상.</p>
        <p style={{flex:1,fontSize:12,color:"#6b7280",lineHeight:1.5,textAlign:"center"}}>사용자가 투자 위험 부담. 퇴직일 기준 30일분 평균임금 × 근속연수 보장.</p>
        <p style={{flex:1,fontSize:12,color:"#6b7280",lineHeight:1.5,textAlign:"center"}}>DB형과 DC형을 동시 설정. 각각의 설정비율 합이 100% 이상.</p>
      </div>
    </div>
  );
}

// ─── Step 1 ─────────────────────────────────────────
function Step1({data,set}) {
  return (<div style={S.stepContent}>
    <h2 style={S.stepTitle}>기업 기본정보 입력</h2>
    <p style={S.stepDesc}>사업자등록증 기준으로 입력해주세요.</p>
    <div style={S.grid2}>
      <Field label="회사명 (상호)" required><input style={S.input} placeholder="(주)○○○○" value={data.companyName||""} onChange={e=>set("companyName",e.target.value)} /></Field>
      <Field label="사업자등록번호" required><input style={S.input} placeholder="000-00-00000" value={data.bizNo||""} onChange={e=>set("bizNo",formatBizNo(e.target.value))} /></Field>
      <Field label="대표자 성명" required><input style={S.input} placeholder="홍길동" value={data.ceoName||""} onChange={e=>set("ceoName",e.target.value)} /></Field>
      <Field label="업종" required><select style={S.input} value={data.industry||""} onChange={e=>set("industry",e.target.value)}><option value="">선택하세요</option>{INDUSTRY_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}</select></Field>
      <Field label="상시 근로자 수" required><input style={S.input} type="number" min="1" placeholder="예: 30" value={data.employeeCount||""} onChange={e=>set("employeeCount",e.target.value)} /></Field>
      <Field label="노동조합원 수"><input style={S.input} type="number" min="0" placeholder="없으면 0" value={data.unionCount||""} onChange={e=>set("unionCount",e.target.value)} /></Field>
    </div>
    <Field label="사업장 주소" required><input style={{...S.input,width:"100%"}} placeholder="서울시 ○○구 ○○로 ○○번길 ○○" value={data.address||""} onChange={e=>set("address",e.target.value)} /></Field>
    <div style={S.grid2}>
      <Field label="전화번호"><input style={S.input} placeholder="02-0000-0000" value={data.phone||""} onChange={e=>set("phone",e.target.value)} /></Field>
      <Field label="팩스번호"><input style={S.input} placeholder="02-0000-0000" value={data.fax||""} onChange={e=>set("fax",e.target.value)} /></Field>
    </div>
  </div>);
}

// ─── Step 2: DC ──────────────────────────────────────
function Step2DC({data,set}) {
  return (<div style={S.stepContent}>
    <h2 style={S.stepTitle}>제도 설계 (DC형)</h2>
    <p style={S.stepDesc}>확정기여형 퇴직연금의 세부 설계 사항을 결정합니다.</p>
    <SmartRec industry={data.industry} count={data.employeeCount} />
    <Field label="가입대상 범위" required>
      <select style={S.input} value={data.coverageType||"all"} onChange={e=>set("coverageType",e.target.value)}>
        <option value="all">전체 근로자</option><option value="specific_group">특정 근로자 집단</option>
        <option value="after_date">특정시점 이후 입사자</option><option value="choice">복수 제도 중 선택</option>
      </select>
    </Field>
    {data.coverageType==="specific_group"&&<Field label="가입대상 근로자 집단 명시"><input style={S.input} placeholder="예: 생산직, 부장 직급 이하" value={data.specificGroup||""} onChange={e=>set("specificGroup",e.target.value)} /></Field>}
    {data.coverageType==="after_date"&&<Field label="기준 입사일"><input style={S.input} type="date" value={data.cutoffDate||""} onChange={e=>set("cutoffDate",e.target.value)} /></Field>}
    <Field label="임원 포함 여부">
      <div style={S.radioGroup}>
        <label style={S.radioLabel}><input type="radio" checked={data.includeExecutives!==true} onChange={()=>set("includeExecutives",false)} /> 제외</label>
        <label style={S.radioLabel}><input type="radio" checked={data.includeExecutives===true} onChange={()=>set("includeExecutives",true)} /> 포함</label>
      </div>
    </Field>
    <ExecutiveInfoBox />
    <Field label="계속근로기간 1년 미만자 가입 허용">
      <div style={S.radioGroup}>
        <label style={S.radioLabel}><input type="radio" checked={data.includeUnder1Year!==true} onChange={()=>{set("includeUnder1Year",false);set("excludeUnder1YearBenefit",false);}} /> 제외 (법 기본)</label>
        <label style={S.radioLabel}><input type="radio" checked={data.includeUnder1Year===true} onChange={()=>set("includeUnder1Year",true)} /> 포함</label>
      </div>
    </Field>
    {data.includeUnder1Year&&(
      <Field label="1년 미만 가입자 급여지급">
        <div style={S.radioGroup}>
          <label style={S.radioLabel}><input type="radio" checked={data.excludeUnder1YearBenefit!==true} onChange={()=>set("excludeUnder1YearBenefit",false)} /> 급여 지급 (가입대상과 동일)</label>
          <label style={S.radioLabel}><input type="radio" checked={data.excludeUnder1YearBenefit===true} onChange={()=>set("excludeUnder1YearBenefit",true)} /> 급여 미지급 (가입만 허용)</label>
        </div>
        {data.excludeUnder1YearBenefit&&<p style={{fontSize:11.5,color:"#9ca3af",marginTop:4,fontStyle:"italic"}}>※ 가입대상에는 포함하되, 계속근로기간 1년 미만인 가입자가 자격을 상실한 경우 급여를 지급하지 않습니다.</p>}
      </Field>
    )}
    <Field label="주 15시간 미만 근로자 가입 허용">
      <div style={S.radioGroup}>

// ─── 규약 생성: DC형 ────────────────────────────────
function generateDC(d) {
  const allOps=[...(d.operationManagers||[]),...(d.operationManagersBanks||[]),...(d.operationManagersIns||[])];
  const allAssets=[...(d.assetManagers||[]),...(d.assetManagersBanks||[]),...(d.assetManagersIns||[])];
  const multi=allOps.length>1; const multiA=allAssets.length>1; const isSmall=Number(d.employeeCount)<300;
  const sf=formatDate(d.startDate); const h=hl;
  const payLabel=d.paymentCycle==="monthly"?"매월 말일":d.paymentCycle==="semiannual"?"매 반기 말일":d.paymentCycle==="quarterly"?"매분기 말일":"매년 말일";
  const ext=d.extensionPeriod==="2month"?"2개월":"1개월";
  const ct=d.coverageType;

  // 제10조
  let a10="";
  if(ct==="all") a10=`제10조(가입대상) 이 제도의 가입대상은 이 사업에 소속된 모든 근로자로 한다.`;
  else if(ct==="specific_group") a10=`제10조(가입대상) 이 제도의 가입대상은 이 사업에 소속된 ${h(d.specificGroup||"(     )")} 근로자로 한다.`;
  else if(ct==="after_date") a10=`제10조(가입대상) 이 제도의 가입대상은 이 사업에 소속된 근로자 중 ${h(formatDate(d.cutoffDate))} 이후 입사한 자로 한다.`;
  else a10=`제10조(가입대상) ① 이 제도의 가입대상은 이 사업에 소속된 근로자 중 이 제도 가입을 신청하는 자로 한다.\n ② 이 사업에 소속된 근로자 중 가입할 퇴직급여제도의 종류를 선택하지 아니한 근로자의 경우 이 제도의 가입대상으로 본다.`;
  // 단서
  const excl1=!d.includeUnder1Year, excl15=!d.includeUnder15Hour;
  let excl="";
  if(excl1&&excl15) excl=" 다만 계속근로기간이 1년 미만인 근로자, 4주간을 평균하여 1주간의 소정근로시간이 15시간 미만인 근로자에 대하여는 그러하지 아니하다.";
  else if(excl1) excl=" 다만 계속근로기간이 1년 미만인 근로자에 대하여는 그러하지 아니하다.";
  else if(excl15) excl=" 다만 4주간을 평균하여 1주간의 소정근로시간이 15시간 미만인 근로자에 대하여는 그러하지 아니하다.";
  a10+=excl;
  if(d.includeExecutives) a10+=` 이 제도의 가입대상에는 사용자와 사용종속 관계에서 근로를 제공하고 임금을 받는 임원(등기이사 포함)을 포함한다.`;

  // 제11조
  const a11_1=ct==="choice"?"이 제도의 가입을 신청한 날을 가입자 자격 취득일로 본다.":"이 제도 설정 이후 가입대상이 되는 날을 가입자 자격 취득일로 본다.";

  // 제12조
  let a12=`제12조(가입기간) 이 제도의 설정일 이후 가입자가 이 사업에서 근로를 제공한 날부터 제11조제2항 각 호별 자격 상실의 사유가 발생한 날까지를 가입기간으로 한다.`;
  if(d.retroactive==="full") a12=`제12조(가입기간) ① 이 제도의 설정일 이후 가입자가 이 사업에서 근로를 제공한 날부터 제11조제2항 각 호별 자격 상실의 사유가 발생한 날까지를 가입기간으로 한다.\n ② 제1항에도 불구하고 이 제도의 설정 이전에 이 사업에서 근로를 제공한 기간(이하 "과거근로기간"이라 한다)이 있는 가입자에 대하여는 과거근로기간을 가입기간에 포함한다. 이 경우 법 제8조제2항에 따라 퇴직금을 미리 정산한 기간은 제외한다.`;
  else if(d.retroactive==="partial") a12=`제12조(가입기간) ① 이 제도의 설정일 이후 가입자가 이 사업에서 근로를 제공한 날부터 제11조제2항 각 호별 자격 상실의 사유가 발생한 날까지를 가입기간으로 한다.\n ② 제1항에도 불구하고 이 제도의 설정 이전에 이 사업에서 근로를 제공한 기간(이하 "과거근로기간"이라 한다)이 있는 가입자에 대하여는 ${h(formatDate(d.retroDate))} 이후 과거근로기간을 가입기간에 포함한다. 이 경우 법 제8조제2항에 따라 퇴직금을 미리 정산한 기간은 제외한다.`;

  // 사업자
  const opsD=multi?`[별지]와 같이 선정한다.`:`다음과 같이 선정한다.\n\n    명칭: ${h(allOps[0]||"○○○○")}`;
  const assD=multiA?`[별지]와 같이 선정한다.`:`다음과 같이 선정한다.\n\n    명칭: ${h(allAssets[0]||"○○○○")}`;
  const a8_2=isSmall?"":`\n ② 사용자가 제6조 또는 제7조에 따른 퇴직연금사업자를 선정하거나 변경한 사유 등은 [별지]와 같다.`;
  const a9=(multi||multiA)?`\n\n제9조(퇴직연금사업자 선택) 가입자는 제6조 및 제7조에 따라 선정된 퇴직연금사업자 중 각각 하나의 기관을 운용관리기관 및 자산관리기관으로 선택하여 가입한다.`:"";

  // 부담금 산정 제13조 추가항 (소급 시)
  let a13_3="";
  if(d.retroactive!=="none") a13_3=`\n ③ 제1항에도 불구하고 과거근로기간에 대한 부담금은 과거근로기간을 가입기간에 포함하기로 한 시점을 기준으로 산정하되, 아래 각 호의 금액 중 큰 금액을 부담금으로 납입하여야 한다.\n  1. 과거근로기간 1년에 대하여 기준시점 이전 1년간 지급받은 임금총액의 12분의 1에 상당하는 금액\n  2. 과거근로기간 1년에 대하여 기준시점을 산정사유 발생일로 하여 산정한 30일분 평균임금에 상당하는 금액`;

  // 제17조 단서 (1년 미만 가입 시 급여 지급 제외 옵션은 일단 기본형)
  const a17=`제17조(급여의 지급사유 발생) 급여의 지급사유는 이 제도의 가입자가 제11조제2항제1호부터 제3호까지의 어느 하나에 해당되어 가입자 자격을 상실하게 된 경우 발생한다.${d.excludeUnder1YearBenefit?" 다만 계속근로기간 1년 미만인 가입자가 그 자격을 상실한 경우에는 그러하지 아니한다.":""}`;

  // 전환권 (DC→DB) - 부칙 제2조로 이동
  let convArt="";
  if(d.allowConversion){
    const nums="①②③④⑤⑥⑦⑧⑨⑩";
    let details="";
    if(d.conversionDetails&&d.conversionDetails.trim()){
      const lines=d.conversionDetails.trim().split("\n").filter(l=>l.trim());
      details=lines.map((l,i)=>` ${nums[i+1]} ${h(l.trim())}`).join("\n");
    } else {
      details=` ② 제1항에 따른 제도전환 기준 및 절차 등 구체적 사항은 사용자가 별도로 정한다.`;
    }
    convArt=`\n제2조(제도의 전환) ① 사용자는 이 제도 가입자에게 확정급여형(또는 혼합형)퇴직연금제도로 전환할 수 있는 기회를 부여할 수 있다.\n${details}`;

  if(multiA){app+=`\n\n[별지] 이 제도의 자산관리기관 (제7조 관련)\n\n`;allAssets.forEach((o,i)=>{app+=`    ${i+1}. ${h(o)}\n`;});}

${h(d.companyName||"(주)○○○○")}


제1장 총 칙

제5조(성실의무) 사용자 및 근로자는 이 규약과 관련 법령에서 정한 퇴직연금제도의 설정 및 운영에 관한 사항을 성실히 준수하여야 한다.


제2장 퇴직연금사업자의 선정

제6조(운용관리기관의 선정 및 변경) ① 사용자는 법 제28조에 따른 운용관리업무를 수행할 퇴직연금사업자(이하 "운용관리기관"이라 한다)를 ${opsD}
 ② 사용자는 운용관리기관을 새로 추가하고자 하는 경우에는 근로자대표의 의견을 들어야 하며, 운용관리기관을 변경하고자 하는 경우에는 근로자대표의 동의를 받아야 한다.

제7조(자산관리기관의 선정 및 변경) ① 사용자는 법 제29조에 따른 자산관리업무를 수행할 퇴직연금사업자(이하 "자산관리기관"이라 한다)를 ${assD}
 ② 사용자는 자산관리기관을 새로 추가하고자 하는 경우에는 근로자대표의 의견을 들어야 하며, 자산관리기관을 변경하고자 하는 경우에는 근로자대표의 동의를 받아야 한다.

제8조(퇴직연금사업자 선정·변경 시 사용자 책무) ① 사용자는 제6조 또는 제7조에 따른 퇴직연금사업자를 선정하거나 변경하는 경우, 관련 서비스 제공 등 퇴직연금제도 전반에 대한 능력과 전문성을 종합적으로 판단하여 정하여야 한다.${a8_2}${a9}


제3장 가입자 및 가입기간

${a10}

제11조(가입자 자격 취득 및 상실) ① ${a11_1}
 ② 다음 각 호에 해당하게 되는 날의 다음 날을 가입자 자격 상실일로 본다.
  1. 가입자가 사망한 때
  2. 퇴직, 해고, 그 밖에 취업규칙 또는 별도로 정하는 규정에 따른 사유로 고용 관계가 종료된 때
  3. 이 제도를 폐지한 때
 ③ 사용자는 가입자의 자격 취득 또는 상실 사유가 발생한 경우 그 사실을 운용관리기관에 전달하여 가입자의 자격 취득 및 상실 등의 업무처리가 이뤄지도록 하여야 한다.

${a12}


제4장 부담금

제13조(부담금의 산정 및 부담) ① 사용자는 가입자의 연간 임금총액의 ${h(d.contributionRate||"12분의 1")}에 해당하는 금액을 통화로 가입자의 이 제도 계정에 납입하여야 한다.
 ② 제1항의 연간 임금총액이라 함은 사용자가 가입자에게 지급한 근로기준법상 임금에 해당하는 금품의 연간 합계액을 말한다.${a13_3}
 ${d.retroactive!=="none"?"④":"③"} 부담금 산정기간 중에 「근로기준법 시행령」 제2조제1항 각 호의 어느 하나에 해당하는 기간이나 「남녀고용평등과 일·가정 양립 지원에 관한 법률」 제19조의2에 따른 육아기 근로시간 단축 기간이 있는 경우, 제1항에 따른 부담금은 해당 기간에 지급된 임금을 제외한 연간 임금총액을 해당 기간을 제외한 연간 기간으로 나누어 산정한다.
 ${d.retroactive!=="none"?"⑤":"④"} 가입자는 제1항에 따른 사용자 부담금 외에 스스로 부담하는 추가 부담금을 본인의 확정기여형퇴직연금제도 계정에 납입할 수 있다.

제14조(부담금의 납입) ① 사용자는 제13조제1항에 따른 부담금을 ${h(payLabel)}까지 정기적으로 가입자의 확정기여형퇴직연금제도 계정에 납입하여야 한다.${d.retroactive!=="none"?`\n ② 사용자는 제13조제3항에 따른 부담금을 과거근로기간을 가입기간에 포함시킨 날에 일시 납입하여야 한다.\n ③ 제13조제${d.retroactive!=="none"?"5":"4"}항에 따른 추가 부담금은 가입자가 자산관리기관에 직접 납부할 수 있다.`:`\n ② 제13조제4항에 따른 추가 부담금은 가입자가 자산관리기관에 직접 납부할 수 있다.`}${d.performanceDC&&d.perfCriteria!=="other"?(()=>{
    const pn=d.retroactive!=="none";
    const artN=pn?"4":"3";
    const ts='style="border:1px solid #999;padding:4px 10px;text-align:center;font-size:12px;"';
    const th='style="border:1px solid #999;padding:4px 10px;text-align:center;font-size:12px;background:#f3f4f6;font-weight:bold;"';
    let tableHtml="";
    const tiers=d.perfTiers||[{label:"16년 이상",rate:"50"},{label:"7~15년",rate:"40"},{label:"1~6년",rate:"30"}];
    const hdrCells=tiers.map(t=>`<td ${th}>근속기간(${h(t.label)})</td>`).join("");
    const dcCells=tiers.map(t=>`<td ${ts}>${h(t.rate+"%")}</td>`).join("");
    const cashCells=tiers.map(t=>`<td ${ts}>${h((100-Number(t.rate||0))+"%")}</td>`).join("");
    const execSection=d.includeExecutives&&d.perfRateExec?`<p style="font-size:12.5px;font-weight:bold;margin:16px 0 6px;">＜임원 납입 비율＞</p><p style="font-size:12px;margin:4px 0;">임원 : 경영성과급 DC 납입비율 (단일율)</p><p style="font-size:12px;margin:4px 0;">단일율 : ${h(d.perfRateExec+"%")}</p><p style="font-size:11px;color:#666;margin:6px 0 0;font-style:italic;">단, 임원의 경우 위의 납입비율에 해당하는 금액이 세법상 임원 퇴직소득한도를 초과하는 경우에는 임원 퇴직소득한도 내에서 납부할 수 있다.</p>`:"";
    tableHtml=`</pre><div style="margin:12px 0;"><p style="font-size:12.5px;font-weight:bold;margin-bottom:6px;">＜직원 납입 비율＞</p><table style="border-collapse:collapse;width:auto;"><tr><td ${th}>구분</td>${hdrCells}</tr><tr><td ${ts}>DC 적립 비율</td>${dcCells}</tr><tr><td ${ts}>현금 지급 비율</td>${cashCells}</tr></table>${execSection}</div><pre style="font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;font-family:'D2Coding','Nanum Gothic Coding',monospace;margin:0;color:#1f2937;">`;
    return `\n ${pn?"④":"③"} 사용자는 제1항에 따른 사용자 부담금 외에 이 사업의 경영실적 등에 따라 지급여부 및 지급액이 결정되는 급여(이하 "경영성과급"이라 한다.)를 제10조에 따른 가입자 자격을 취득하는 날부터 다음의 납입비율로 가입자의 확정기여형퇴직연금제도 계정에 추가 납입하여야 한다.${tableHtml}\n ${pn?"⑤":"④"} 제${artN}항에도 불구하고 가입자는 다음 각 호에 해당하는 날에 경영성과급을 향후 적립하지 아니할 것을 선택할 수 있다.\n  1. 이 사업에 제${artN}항의 적립방식이 최초로 설정되는 날 (이 사업에 최초로 근무하게 된 날에 제${artN}항의 적립 방식이 이미 설정되어 있는 경우에는 제10조에 따른 가입 대상이 되는 날)\n  2. 제${artN}항의 적립방식이 변경되는 날\n ${pn?"⑥":"⑤"} 가입자는 제${artN}항에 따른 납입 비율을 임의로 변경하거나, 납입 중단 또는 추가 납입을 임의로 선택할 수 없다.`;
  })():""}

제15조(부담금 미납 시 처리) ① 사용자가 제13조제1항에 따른 부담금을 제14조제1항에 따라 정하여진 기일(이하 "정기 납입일"이라 한다)까지 납입하지 아니한 경우 정기 납입일로부터 ${h(ext)}이 되는 날까지 납부기간을 연장한다.
 ② 법 제20조제3항 후단에 따라 제1항에 따라 연장된 기일까지 제13조제1항에 따른 부담금을 납입한 경우 지연이자는 적용하지 아니한다.
 ③ 사용자가 제1항에 따라 연장된 기일까지 제13조제1항에 따른 부담금을 납입하지 아니하는 경우 그 연장된 기일 다음 날부터 부담금을 납입한 날까지 지연 일수에 대하여 다음 각 호의 구분에 따른 지연이자율을 적용하여 납입하여야 한다.
  1. 제1항에 따라 연장된 납입 기일의 다음 날을 기산일로 하여 가입자의 퇴직 등 급여를 지급할 사유가 발생한 날부터 14일까지의 기간: 연 100분의 10
  2. 제1호에 따른 기간의 다음 날부터 부담금을 납입하는 날까지의 기간: 연 100분의 20
 ④ 제3항에도 불구하고 「근로자퇴직급여 보장법 시행령」(이하 "영"이라 한다) 제12조에 따라 지연이자의 적용제외 사유가 있는 경우에는 지연이자를 적용하지 아니한다.


제5장 급여

제16조(급여의 종류 및 수급요건) 이 제도에 따른 급여의 종류는 연금 또는 일시금으로 하되, 수급요건은 다음 각 호와 같다.
  1. 연금은 55세 이상으로서 가입기간이 10년 이상인 가입자에게 지급할 것. 이 경우 연금의 지급기간은 5년 이상이어야 한다.
  2. 일시금은 연금수급 요건을 갖추지 못하거나 일시금 수급을 원하는 가입자에게 지급할 것

${a17}

제18조(미납 부담금 등의 납입) ① 사용자는 급여를 지급할 사유가 발생한 경우 14일 이내에 제13조에 따른 부담금을 가입자의 이 제도 계정에 납입하여야 한다.
 ② 사용자는 제15조제1항에 따른 미납 부담금이 있는 경우에는 그 미납 부담금과 제15조제3항에 따른 지연이자를 급여를 지급할 사유가 발생한 날부터 14일 이내에 해당 가입자의 이 제도의 계정에 납입하여야 한다.
 ③ 사용자는 제1항 및 제2항에도 불구하고 특별한 사정이 있는 경우 가입자와의 합의에 따라 납입 기일을 연장할 수 있다.

제19조(급여의 지급) ① 사용자는 이 제도의 급여를 지급하는 경우 가입자가 지정한 개인형퇴직연금제도의 계정 또는 중소기업퇴직연금기금제도의 가입자명의의 부담금 계정(이하 "개인형퇴직연금제도의 계정등"이라 한다)으로 이전하는 방법으로 한다.
 ② 가입자는 이 제도 가입 이후 7일 이내에 제1항에 따른 급여를 이전받기 위한 개인형퇴직연금제도의 계정등을 설정하고 그 확인자료를 사용자에게 제출하는 등의 방법으로 지정의 의사를 표시하여야 한다.
 ③ 제17조에 따른 급여의 지급사유가 발생될 예정이거나 발생했음에도 불구하고 가입자가 개인형퇴직연금제도의 계정등을 지정하지 아니한 경우, 사용자는 제1항에 따라 급여가 이전될 수 있도록 가입자에게 개인형퇴직연금제도의 계정등을 지정할 것을 신속히 안내하여야 한다.
 ④ 제2항 및 제3항에도 불구하고 급여를 지급할 사유가 발생한 날부터 7일 이내에 가입자가 개인형퇴직연금제도의 계정등을 지정하지 아니하는 경우에는 법 제17조제5항에 따라 가입자 명의의 개인형퇴직연금제도 계정등으로 이전한다.
 ⑤ 제1항에도 불구하고 영 제9조 각 호의 사유에 해당하는 경우에는 개인형퇴직연금제도의 계정등으로의 이전 이외의 방법으로 급여를 지급할 수 있다.

제20조(급여의 지급절차) ① 사용자는 급여를 지급할 사유가 발생한 경우 제19조에 따른 개인형퇴직연금제도의 계정등으로 급여를 이전할 것을 운용관리기관에 지시하여야 한다.
 ② 사용자는 제1항에 따라 급여의 지급을 지시할 때에는 가입자가 제출한 개인형퇴직연금제도 확인서를 첨부하여야 한다. 다만 제19조제4항의 경우에는 그러하지 아니하다.
 ③ 사용자는 운용관리기관으로 하여금 급여의 지급사유 발생 사실 등을 자산관리기관에 전달하도록 하여 가입자의 개인형퇴직연금제도의 계정등으로 급여가 이전될 수 있도록 하여야 한다.
 ④ 사용자는 가입자가 퇴직연금사업자에 직접 급여를 청구한 경우에는 퇴직연금사업자가 지체 없이 그 내용을 사용자에게 알리도록 하여 제1항에 따른 지급 지시가 이루어질 수 있도록 하여야 한다.
 ⑤ 제1항에도 불구하고 사업의 도산 등으로 사용자를 통한 급여의 지급절차 진행이 곤란한 경우 가입자는 퇴직연금사업자에게 직접 급여를 청구할 수 있다.
 ⑥ 가입자는 퇴직할 때에 받을 급여를 갈음하여 그 운용 중인 자산을 가입자가 설정한 개인형퇴직연금제도의 계정등으로 이전해 줄 것을 해당 퇴직연금사업자에게 요청할 수 있다.
 ⑦ 제6항에 따른 가입자의 요청이 있는 경우 퇴직연금사업자는 그 운용 중인 자산을 가입자의 개인형퇴직연금제도의 계정등으로 이전하여야 한다.


제6장 적립금의 운용

제21조(적립금 운용방법 선정 및 운용지시) ① 가입자는 운용관리기관이 제시한 적립금 운용방법 중에서 스스로의 선택으로 운용방법을 선정할 수 있고, 반기 1회 이상 이를 변경할 수 있다.
 ② 가입자는 제1항에 따라 적립금 운용방법을 선정하거나 변경하고자 하는 경우 운용관리기관이 정하는 절차 및 방법에 따라 운용지시를 하여야 한다.
 ③ 사용자는 가입자가 적립금 운용방법을 변경하는 경우 중도해지이율 적용 또는 중도해지에 따른 수수료 등의 부담에 관한 구체적 내용을 운용관리기관으로 하여금 가입자에게 안내하도록 하여야 한다.

제22조(적립금 운용방법 제시) ① 사용자는 운용관리기관으로 하여금 반기마다 1회 이상 위험과 수익구조가 서로 다른 세 가지 이상의 적립금 운용방법을 가입자에게 제시하도록 하여야 한다.
 ② 사용자는 운용관리기관이 제1항에 따라 적립금의 운용방법을 제시함에 있어 다음 각 호의 요건을 갖춘 운용방법을 제시하도록 하여야 한다.
  1. 운용방법에 관한 정보의 취득과 이해가 쉬울 것
  2. 운용방법 간의 변경이 쉬울 것
  3. 적립금 운용결과의 평가 방법과 절차가 투명할 것
  4. 영 제25조제1항에 따른 원리금보장 운용방법이 하나 이상 포함될 것

제23조(적립금 운용방법의 정보제공) ① 사용자는 운용관리기관으로 하여금 다음 각 호에서 정한 사항을 포함하여 가입자가 적립금 운용방법을 선정하는 데 필요한 정보를 제공하도록 하여야 한다.
  1. 운용방법별 이익 및 손실의 가능성
  2. 운용방법별 과거 3년간의 이익 또는 손실 관련 실적. 다만 해당 운용방법의 과거 취급기간이 3년에 미치지 못하는 경우에는 그 취급기간에 한한다.
  3. 운용방법의 선정 또는 변경에 따라 발생하는 운용수탁보수, 중도해지 또는 환매수수료 등의 비용 및 그 부담 방법에 관한 사항
  4. 예금자보호법에 의한 보호대상 등 지급보장의 정도
  5. 그 밖에 가입자가 운용지시를 하는 데 필요한 정보
 ② 사용자는 운용관리기관이 다음 각 호의 어느 하나에 해당하는 방법으로 적립금 운용방법에 관한 정보를 가입자에게 제공하도록 하여야 한다.
  1. 우편 발송
  2. 서면 교부
  3. 정보통신망에 의한 전송
 ③ 사용자는 운용관리기관으로 하여금 가입자에게 매 반기 1회 이상 정기적으로 제1항에 따른 적립금 운용방법에 관한 정보의 제공을 하도록 하여야 한다.

제24조(사전지정운용방법의 선정) ① 가입자는 제21조에 따른 운용방법 선정과 별도로 운용관리기관이 [별지]에 따라 제시하는 사전지정운용방법 중 하나를 본인이 적용받을 사전지정운용방법으로 선정해야 한다.
 ② 가입자는 제1항에서 선정한 사전지정운용방법을 변경할 수 있다.

제24조의2(사전지정운용방법에 대한 정보제공) ① 사용자는 가입자가 제24조에 따른 사전지정운용방법을 선정할 수 있도록 운용관리기관으로 하여금 [별지]의 사전지정운용방법에 대하여 다음 각 호의 사항에 관한 정보를 제공하게 하여야 한다.
  1. 해당 사전지정운용방법의 자산배분 현황 및 위험·수익 구조
  2. 법 제21조의3제2항부터 제5항에 따른 사전지정운용제도의 운영에 대한 내용
  3. 위험등급, 손실가능성 및 과거수익률
  4. 수수료 등 가입자가 부담하는 비용에 관한 사항
  5. 예금자 보호 한도 등 가입자의 보호에 관한 사항
  6. 사전지정운용방법의 적용에 따른 퇴직연금자산의 위험도 변경 가능성
  7. 법 제21조의3제6항에 따라 사전지정운용방법이 변경될 수 있다는 사실과 그 절차
  8. 사전지정운용방법의 승인일자 등 승인에 관한 사항
  9. 기타 고용노동부장관이 정하는 사항
 ② 사용자는 운용관리기관이 제1항에 따른 정보를 서면 또는 정보통신망 등에 의한 방법으로 알릴 수 있도록 가입자에 관한 정보 제공에 협조해야 한다.

제24조의3(사전지정운용방법 적용의 통지) 사용자는 제21조제1항에 따른 적립금 운용방법을 선정하지 않은 가입자가 다음 각 호에 해당하는 경우, 운용관리기관으로 하여금 제24조에 따라 가입자가 선정한 사전지정운용방법으로 적립금이 운용됨을 통지하도록 하여야 한다.
  1. 가입자가 이 제도에 가입하고 사용자가 제13조에 따른 부담금을 최초로 납입한 때
  2. 가입자가 제21조제1항에 따라 스스로 선정한 적립금 운용방법의 기간 만료일부터 4주가 지났을 때

제24조의4(사전지정운용방법의 적용) ① 가입자가 제24조의3에 따른 통지를 받은 이후에도 별도의 운용지시 없이 2주가 경과한 경우 제24조제1항에 따라 본인이 선정한 사전지정운용방법으로 적립금이 운용된다.
 ② 제1항에 따라 적립금을 운용하는 가입자는 언제든지 제21조에 따라 적립금 운용방법을 스스로 선정할 수 있다.

제24조의5(사전지정운용방법의 변경) 사용자는 운용관리기관이 [별지]에 따른 사전지정운용방법 중 어느 하나에 대하여 고용노동부 장관으로부터 변경 승인을 받은 경우, 운용관리기관으로 하여금 변경 승인을 받은 날부터 7일 이내에 해당 사전지정운용방법을 본인이 적용받을 사전지정운용방법으로 선정하였거나 운용하고 있는 가입자에게 다음 각 호의 내용을 포함하여 통지하도록 해야 한다.
  1. 사전지정운용방법 변경 사유
  2. 변경되는 사전지정운용방법에 관한 정보로서 제24조의2제1항 각 호에 관한 사항
  3. 사전지정운용방법 변경에 대한 고용노동부장관의 승인 사실
  4. 가입자의 적립금이 변경된 사전지정운용방법으로 운용된다는 사실
  5. 변경된 사전지정운용방법으로 운용된 이후 가입자는 언제든지 스스로 운용방법을 선정할 수 있다는 사실

제24조의6(사전지정운용방법 취소) ① 사용자는 [별지]에 따른 사전지정운용방법이 고용노동부장관으로부터 승인 취소된 경우에는 운용관리기관으로 하여금 해당 사전지정운용방법을 본인이 적용받을 사전지정운용방법으로 선정하였거나 해당 사전지정운용방법으로 적립금이 운용되고 있는 가입자에게 다음 각 호의 사항을 통지하도록 해야 한다.
  1. 승인 취소 사유
  2. 승인 취소된 사전지정운용방법의 해지 방법·절차에 관한 사항
  3. 다른 사전지정운용방법을 포함한 3가지 이상의 운용방법에 관한 정보로서 제24조의2 제1항 각 호에 관한 정보
 ② 제1항의 조치에도 불구하고 가입자가 해당 사전지정운용방법을 해지하지 않거나 다른 운용방법을 선택하지 않을 경우 퇴직연금사업자로 하여금 가입자의 적립금을 같은 위험등급의 다른 사전지정운용방법으로 이전하여 운용할 수 있다는 사실을 통지하도록 해야 한다.
 ③ 제2항에 따라 적립금을 운용하는 경우 퇴직연금사업자로 하여금 다음 각 호의 사항을 통지하도록 해야 한다.
  1. 적립금을 이전하여 운용한다는 사실
  2. 적립금을 이전한 운용방법에 관한 정보로서 제24조의2 각호에 관한 정보


제7장 수급권 보호 및 중도인출

제25조(수급권의 보호) ① 가입자는 이 제도의 급여를 받을 권리를 양도 또는 압류하거나 담보로 제공할 수 없다.
 ② 제1항에도 불구하고 가입자는 다음 각 호의 어느 하나에 해당하는 사유와 요건을 갖춘 경우에는 이 제도의 급여를 받을 권리를 담보로 제공할 수 있다.
  1. 무주택자인 가입자가 본인 명의로 주택을 구입하는 경우
  2. 무주택자인 가입자가 주거를 목적으로 「민법」 제303조에 따른 전세금 또는 「주택임대차보호법」 제3조의2에 따른 보증금을 부담하는 경우. 이 경우 가입자가 하나의 사업 또는 사업장(이하 "사업"이라 한다)에 근로하는 동안 1회로 한정한다.
  3. 가입자가 6개월 이상 요양을 필요로 하는 다음 각 목의 어느 하나에 해당하는 사람의 질병이나 부상에 대한 의료비(「소득세법 시행령」 제118조의5제1항 및 제2항에 따른 의료비를 말한다)를 부담하는 경우
   가. 가입자 본인
   나. 가입자의 배우자
   다. 가입자 또는 그 배우자의 부양가족(「소득세법」 제50조제1항제3호에 따른 부양가족을 말한다. 이하 같다)
  4. 담보를 제공하는 날부터 거꾸로 계산하여 5년 이내에 가입자가 「채무자 회생 및 파산에 관한 법률」에 따라 파산선고를 받은 경우
  5. 담보를 제공하는 날부터 거꾸로 계산하여 5년 이내에 가입자가 「채무자 회생 및 파산에 관한 법률」에 따라 개인회생절차개시 결정을 받은 경우
  6. 다음 각 목의 어느 하나에 해당하는 사람의 대학등록금, 혼례비 또는 장례비를 가입자가 부담하는 경우
   가. 가입자 본인
   나. 가입자의 배우자
   다. 가입자 또는 그 배우자의 부양가족
  7. 그 밖에 사업주의 휴업 실시로 근로자의 임금이 감소하거나 재난으로 피해를 입은 경우 등 고용노동부장관이 정하여 고시하는 사유와 요건에 해당하는 경우
 ③ 제2항에 따른 담보제공의 한도는 다음 각 호의 구분에 따른다.
  1. 제2항제1호부터 제6호까지의 경우: 가입자별 적립금의 100분의 50
  2. 제2항제7호의 경우: 고용노동부장관이 정하여 고시하는 한도
 ④ 사용자는 가입자가 대출을 받고자 하는 경우 퇴직연금사업자(자산관리기관)로부터 필요한 서류를 발급받을 수 있도록 하여야 한다.

제26조(중도인출) ① 가입자는 다음 각 호의 어느 하나에 해당하는 사유가 발생하면 적립금을 중도인출할 수 있다.
  1. 제25조제2항제1호, 제2호, 제7호(재난으로 피해를 입은 경우로 한정한다)에 해당하는 경우
  2. 제25조제2항제3호에 해당하는 경우로서 가입자가 본인 연간 임금총액의 1천분의 125를 초과하여 의료비를 부담하는 경우
  3. 중도인출을 신청한 날부터 거꾸로 계산하여 5년 이내에 가입자가 파산선고를 받은 경우
  4. 중도인출을 신청한 날부터 거꾸로 계산하여 5년 이내에 가입자가 개인회생절차개시 결정을 받은 경우
  5. 법 제7조제2항 후단에 따라 퇴직연금제도의 급여를 받을 권리를 담보로 제공하고 대출을 받은 가입자가 그 대출 원리금을 상환하기 위한 경우
 ② 가입자는 중도인출을 받고자 하는 경우 제1항의 어느 하나에 해당하는 사유를 갖추었음을 증빙할 수 있는 자료를 첨부하여 퇴직연금사업자에게 중도인출을 신청하여야 한다.


제8장 운용·자산관리업무 계약의 체결, 해지 및 이전

제27조(운용관리업무에 관한 계약의 체결) ① 사용자는 법 제28조에 따라 다음 각 호의 업무(이하 "운용관리업무"라 한다)를 하는 것을 내용으로 하는 계약을 제6조에서 선정한 운용관리기관과 체결하여야 한다.
  1. 가입자에 대한 적립금 운용방법 및 운용방법별 정보의 제공
  1의2. 사전지정운용제도의 설정 및 운영에 관한 업무
  2. 적립금 운용현황의 기록·보관·통지
  3. 가입자가 선정한 운용방법을 자산관리기관에게 전달하는 업무
  4. 그 밖에 운용관리업무의 적절한 수행을 위하여 필요한 업무
 ② 사용자는 운용관리업무에 관한 계약을 체결 또는 변경하는 경우 그 내용을 가입자에게 알려야 한다.

제28조(자산관리업무에 관한 계약의 체결) ① 사용자는 법 제29조에 따라 다음 각 호의 업무(이하 "자산관리업무"라 한다)를 하는 것을 내용으로 하는 계약을 제7조에서 선정한 자산관리기관과 체결하여야 한다.
  1. 계좌의 설정 및 관리
  2. 부담금의 수령
  3. 적립금의 보관 및 관리
  4. 운용관리기관이 전달하는 적립금 운용지시의 이행
  5. 급여의 지급
  6. 그 밖에 자산관리업무의 적절한 수행을 하는데 필요한 업무
 ② 사용자는 제1항에 따른 계약을 체결하려는 경우에는 가입자를 피보험자 또는 수익자로 하여 영 제24조에서 정하는 요건을 갖춘 보험계약 또는 신탁계약의 방법으로 하여야 한다.
 ③ 사용자는 자산관리업무에 관한 계약을 체결 또는 변경하는 경우 그 내용을 가입자에게 알려야 한다.

제29조(수수료의 부담) ① 사용자 부담금에 대한 운용관리업무 및 자산관리업무 수수료는 사용자가 부담한다.
 ② 가입자 추가 부담금에 대한 운용관리 및 자산관리업무 수수료는 가입자가 부담한다.
 ③ 사용자는 제2항에 따른 수수료율 및 부담방법 등 그 구체적 사항을 퇴직연금사업자로 하여금 가입자에게 알리도록 하여야 한다.

제30조(계약해지) 사용자는 다음 각 호의 어느 하나에 해당하는 경우에 제27조 및 제28조에 따른 계약을 해지할 수 있다.
  1. 이 제도의 폐지
  2. 퇴직연금사업자의 변경
  3. 퇴직연금사업자의 계약 위반
  4. 퇴직연금사업자의 등록취소 또는 등록말소

제31조(계약이전) 사용자는 제30조제2호부터 제4호까지의 사유에 해당하는 경우 이 제도의 이전에 필요한 조치를 하여야 한다.


제9장 제도의 폐지·중단

제32조(제도의 폐지) ① 이 제도는 다음 각 호의 어느 하나에 해당하는 경우에 폐지할 수 있다.
  1. 사업의 소멸·도산
  2. 다른 퇴직급여제도로의 변경
 ② 사용자는 제1항에 따라 이 제도를 폐지하는 경우 근로자대표의 동의를 받아야 한다.
 ③ 사용자는 영 제38조제1호에 따라 폐지한 날부터 1개월 이내에 고용노동부장관에게 폐지신고서를 제출하여야 한다.
 ④ 사용자는 이 제도 폐지일을 기준으로 산정된 가입자별 미납 부담금, 가입자별 급여 내역 및 지급절차, 중간정산 대상기간 등을 가입자에게 통지하여야 한다.
 ⑤ 사용자는 제4항에 따른 통지를 함에 있어 미납 부담금이 있는 경우에는 그 금액과 지연이자를 포함한 금액, 납입 예정일 및 해소 방안도 함께 제시하여야 한다.
 ⑥ 사용자는 이 제도 폐지일부터 14일 이내에 미납 부담금 및 지연이자를 퇴직연금사업자에게 납입한 후 퇴직연금사업자로 하여금 급여를 지급하도록 하는데 필요한 조치를 하여야 한다.

제33조(제도 폐지 시 급여 처리) ① 제32조에 따라 가입자가 급여를 받은 경우에는 법 제8조제2항에 따라 중간정산되어 받은 것으로 본다.
 ② 제1항에 따른 가입자별 중간정산 대상기간은 가입자별로 퇴직연금에 가입한 날부터 사용자가 납입한 부담금에 대응하는 기간의 마지막 날까지로 환산한다.
 ③ 사용자는 이 제도의 폐지로 퇴직연금사업자로 하여금 가입자에게 급여를 지급하도록 하는 경우 제18조부터 제20조까지의 규정을 따른다.

제34조(제도의 운영중단) ① 사용자가 법 또는 이 규약에 위반되는 행위를 하여 고용노동부장관이 이 제도의 중단을 명한 경우 이 제도의 운영을 중단하기로 한다.
 ② 이 제도의 운영이 중단된 경우 중단된 기간에 대하여는 법 제8조제1항에 따른 퇴직금제도를 적용한다.
 ③ 사용자는 이 제도의 중단에도 불구하고 기본적인 업무(가입자 통지, 교육, 급여 지급 등)는 유지하여야 한다.
 ④ 사용자는 이 제도의 중단에도 불구하고 퇴직연금사업자로 하여금 기본적인 업무(급여 지급, 교육, 적립금 운용 등)를 유지하도록 하여야 한다.


제10장 운용현황의 통지 및 가입자 교육

제35조(운용현황의 통지) ① 사용자는 운용관리기관으로 하여금 가입자별 운용현황을 매년 1회 이상 가입자에게 통지하도록 하여야 한다. 이 경우 가입자별 적립금의 운용수익 및 운용방법별 구성비율 등의 내용이 포함되어야 한다.
 ② 제1항에 따른 운용현황의 통지는 우편 발송, 서면 교부, 정보통신망에 의한 전송 등의 방법으로 이루어져야 한다.
 ③ 사용자는 부담금이 1개월 이상 미납되거나 적립금 운용수익률이 현저히 변동한 경우 10일 이내에 가입자에게 알리도록 하여야 한다.

제36조(가입자 교육) ① 사용자는 매년 1회 이상 가입자에게 이 제도의 운영상황 등 다음 각 목의 사항에 대하여 교육을 실시하여야 한다.
  1. 제도 일반에 관한 교육사항
   가. 급여 종류에 관한 사항, 수급요건, 급여액 등 제도별 특징 및 차이점
   나. 담보대출, 중도인출, 지연이자 등 해당 사업의 퇴직연금제도 운영에 관한 사항
   다. 급여 또는 부담금 산정의 기준이 되는 임금 등에 관한 사항
   라. 퇴직 시 급여 지급절차 및 개인형퇴직연금제도로의 적립금 이전에 관한 사항
   마. 연금소득세, 퇴직소득세 등 과세 체계에 관한 사항
   바. 해당 사업의 퇴직연금제도를 중단하거나 폐지하는 경우 그 처리방법
   사. 가입자의 소득, 자산, 부채, 나이 및 근속연수 등을 고려한 자산·부채관리의 일반적 원칙과 노후 설계의 중요성에 관한 사항
  2. 이 제도의 설정에 따른 추가 교육사항
   가. 매년 적립금액 및 운용수익률, 수수료 등 운용현황
   나. 분산투자 등 안정적 운용을 위해 행하는 투자원칙
   다. 운용방법별 이익, 손실의 가능성 및 수수료 등 비용 부담에 관한 사항
   라. 사전지정운용방법에 관한 사항
   마. 그 밖에 사용자가 추가로 교육이 필요하다고 인정한 사항
 ② 제1항에 따른 교육의 방법 및 절차에 관한 사항은 다음 각 호의 구분에 따른다.
  1. 제1항제1호의 제도 일반에 관한 교육사항은 사내 정보통신망 또는 사업장 게시판 게시 등을 가입자가 수시로 열람할 수 있도록 한다. 다만 이 제도 설정 후 최초 교육은 교육자료를 우편으로 발송하거나 직원연수·조회·회의·강의 등 대면하여 전달하는 방식으로 실시한다.
  2. 제1항제2호의 이 제도의 설정에 따른 추가 교육사항은 다음 각 목 중 하나 이상의 방법으로 실시한다.
   가. 서면 또는 전자우편 등을 통한 정기적인 교육자료의 발송
   나. 직원연수·조회·회의·강의 등의 대면 교육의 실시
   다. 정보통신망을 통한 온라인 교육의 실시
   라. 해당 사업장 게시판 등에 상시 게시${d.educationDelegate!==false?`\n ③ 사용자는 퇴직연금사업자에게 제1항 및 제2항에 따른 교육의 실시를 위탁할 수 있다.\n ④ 제3항에 따라 퇴직연금사업자에게 가입자 교육의 실시를 위탁하는 경우 사용자는 퇴직연금사업자와 교육시기, 교육내용, 구체적 교육방법 등을 포함한 계약을 체결하여 퇴직연금사업자로 하여금 위탁계약의 내용에 따라 교육을 실시하도록 하여야 한다.\n ⑤ 사용자는 제3항 및 제4항에 따라 교육의 실시를 위탁한 경우 교육의 실시를 위하여 필요한 사항에 협조하고, 그 실시 결과를 확인하여야 한다.`:""}


제11장 기타

제37조(사업연도) 이 제도의 사업연도는 이 사업의 회계연도를 기준으로 하며, 회계 결산월은 ${h((d.fiscalMonth||"12")+"월")}로 한다.

제38조(규약의 변경) ① 사용자는 이 규약의 내용을 변경하고자 하는 경우에는 근로자대표의 의견을 들어야 한다. 다만, 근로자에게 불리하게 변경하려는 경우에는 근로자대표의 동의를 받아야 한다.
 ② 사용자는 제1항에 따른 규약의 변경 시 그 내용을 가입자에게 알려야 한다.
 ③ 사용자는 규약이 변경된 경우 그 내용을 퇴직연금사업자에게 통지하여야 한다.

제39조(법령 등의 준용) ① 이 규약에서 정하지 아니한 사항은 관련 법령 및 취업규칙 등에서 정한 바에 따른다.
 ② 이 규약에서 정한 사항을 관련 법령에서 변경한 경우에는 그에 따르기로 한다.

  1. 사용자가 운영하는 사내 전산망에 대한 이용 제공

  3. 사용자에게 서면 또는 정보통신망을 활용하여 전체 근로자를 대상으로 재정검증결과를 통보하는 행위의 수행

제21조(적립 부족의 해소) 사용자는 영 제6조에 따른 재정검증 결과 적립금이 최소적립금의 95%에 미치지 못하는 것으로 확인된 경우 다음 각 호의 조치를 하여야 한다.
  1. 사용자는 부담금 납입 등을 통해 최소적립금 대비 부족분 비율의 3분의 1 이상을 직전 사업연도 종료 후 1년 이내에 해소하여야 한다.
  2. 사용자는 제1호의 조치를 이행하기 위한 자금 조달방안, 납입 계획 등의 내용을 포함한 계획서(이하 "재정안정화계획서"라 한다)를 구체적으로 작성하여 3년간 보존하여야 한다.
  3. 사용자는 영 제6조에 따라 퇴직연금사업자로부터 재정검증 결과를 통보받은 날부터 60일 이내에 근로자대표 또는 전체 근로자에게 재정안정화계획서를 통보하여야 한다.


제6장 운용·자산관리업무 계약의 체결, 해지 및 이전

제22조(운용관리업무에 관한 계약의 체결) ① 사용자는 법 제28조에 따라 다음 각 호의 업무(이하 "운용관리업무"라 한다)를 하는 것을 내용으로 하는 계약을 제6조에서 선정한 운용관리기관과 체결하여야 한다.
  1. 사용자에 대한 적립금 운용방법 및 운용방법별 정보의 제공
  2. 연금제도 설계 및 연금 회계처리
  3. 적립금 운용현황의 기록·보관·통지
  4. 사용자가 선정한 운용방법을 자산관리기관에게 전달하는 업무
  5. 가입자 교육을 위탁하고자 하는 경우 위탁받은 교육의 실시
  6. 그 밖에 운용관리업무의 적절한 수행을 위하여 필요한 업무${multi?`\n ② 제1항에도 불구하고 운용관리기관이 복수인 경우에는 다음 각 호의 업무를 수행하는 것을 내용으로 하는 계약을 간사기관과 체결하여야 한다.\n  1. 법 제16조에 따른 급여 지급능력 확보 여부의 확인 및 그 결과의 통보\n  2. 영 제4조제1항제1호에 따른 부담금의 산정\n  3. 퇴직 등 사유가 발생한 경우 급여를 지급할 퇴직연금사업자의 선정에 관한 사항\n  4. 그 밖에 신규 가입자의 등재, 적립금액 및 운용현황의 통지 등 제도의 안정적·통일적 운용을 위하여 필요한 사항`:""}
 ${multi?"③":"②"} 사용자는 운용관리업무에 관한 계약을 체결 또는 변경하는 경우 그 내용을 가입자에게 알려야 한다.

제23조(자산관리업무에 관한 계약의 체결) ① 사용자는 법 제29조에 따라 다음 각 호의 업무(이하 "자산관리업무"라 한다)를 하는 것을 내용으로 하는 계약을 제7조에서 선정한 자산관리기관과 체결하여야 한다.
  1. 계좌의 설정 및 관리
  2. 부담금의 수령
  3. 적립금의 보관 및 관리
  4. 운용관리기관이 전달하는 적립금 운용지시의 이행
  5. 급여의 지급
  6. 그 밖에 자산관리업무의 적절한 수행을 하는데 필요한 업무
 ② 사용자는 제1항에 따른 계약을 체결하려는 경우에는 가입자를 피보험자 또는 수익자로 하여 영 제24조에서 정하는 요건을 갖춘 보험계약 또는 신탁계약의 방법으로 하여야 한다.
 ③ 사용자는 자산관리업무에 관한 계약을 체결 또는 변경하는 경우 그 내용을 가입자에게 알려야 한다.

제24조(수수료의 부담) 제22조 및 제23조에 따른 운용관리업무 및 자산관리업무의 수행에 대한 수수료는 사용자가 부담한다.

제25조(계약해지) 사용자는 다음 각 호의 어느 하나에 해당하는 경우에 제22조 및 제23조에 따른 계약을 해지할 수 있다.
  1. 이 제도의 폐지
  2. 퇴직연금사업자의 변경
  3. 퇴직연금사업자의 계약 위반
  4. 퇴직연금사업자의 등록취소 또는 등록말소

제26조(계약이전) 사용자는 제25조제2호부터 제4호까지의 사유 중 어느 하나에 해당하는 경우 이 제도의 이전에 필요한 조치를 하여야 한다.


제7장 제도의 폐지·중단

제27조(제도의 폐지) ① 이 제도는 다음 각 호의 어느 하나에 해당하는 경우에 폐지할 수 있다.
  1. 사업의 폐업·소멸·도산
  2. 퇴직금제도로의 환원
  3. 퇴직금제도를 제외한 다른 퇴직급여제도로의 변경
 ② 사용자는 제1항에 따라 이 제도를 폐지하고자 하는 경우 근로자대표의 동의를 받아야 한다.
 ③ 사용자는 영 제38조제1호에 따라 폐지한 날부터 1개월 이내에 고용노동부장관에게 폐지신고서를 제출하여야 한다.
 ④ 사용자는 제1항제1호 및 제2호에 따라 이 제도가 폐지되는 경우 이 제도 폐지일을 기준으로 산정된 적립금, 적립 부족액, 가입자별 급여 내역 및 지급절차, 중간정산 대상기간 등을 가입자에게 통지하여야 한다.
 ⑤ 사용자는 제1항제1호 및 제2호에 따라 이 제도가 폐지되는 경우 이 제도 폐지일부터 14일 이내에 퇴직연금사업자가 적립금으로 급여를 지급하도록 하는데 필요한 조치를 하여야 한다.

제28조(제도 폐지 시 급여 처리) ① 제27조제1항제1호 및 제2호에 따라 가입자가 급여를 받은 경우에는 법 제8조제2항에 따라 중간정산되어 받은 것으로 본다.
 ② 제1항에 따른 가입자별 중간정산금은 이 제도에 따라 적립된 금액을 가입자별 근속기간·평균임금과 제12조에 따른 급여수준을 고려하여 안분·산정하고, 중간정산 대상기간은 중간정산금을 기준으로 환산한다.
 ③ 사용자는 이 제도의 폐지로 퇴직연금사업자로 하여금 가입자에게 급여를 지급하도록 하는 경우 제15조부터 제17조까지의 규정을 따른다.

제29조(제도의 운영중단) ① 사용자가 법 또는 이 규약에 위반되는 행위를 하여 고용노동부장관이 이 제도의 중단을 명한 경우 이 제도의 운영을 중단하기로 한다.
 ② 이 제도의 운영이 중단된 경우 중단된 기간에 대하여는 법 제8조제1항에 따른 퇴직금제도를 적용한다.
 ③ 사용자는 이 제도의 중단에도 불구하고 다음 각 호의 기본적인 업무는 유지하여야 한다.
  1. 가입자에게 제도 중단 사유 및 중단일, 재개시 일정, 미납 부담금이 있는 경우 그 납입계획 등 제도 중단기간의 처리방안 등의 공지
  2. 가입자 교육의 실시
  3. 급여 지급의 요청, 적립금 운용 등과 관련하여 법령 등에 규정된 업무의 이행을 위해 필요한 조치
  4. 그 밖에 이 제도의 연속성 유지 및 가입자 보호를 위하여 필요한 업무
 ④ 사용자는 이 제도의 중단에도 불구하고 퇴직연금사업자로 하여금 다음 각 호의 기본적인 업무를 유지하도록 하여야 한다.
  1. 가입자 퇴직 등에 따른 급여의 지급
  2. 가입자 교육을 위탁받은 경우 위탁받은 교육의 실시
  3. 급여의 지급, 적립금의 운용, 운용현황의 통지 등과 관련하여 법령 및 운용·자산관리업무의 계약에서 정해진 업무
  4. 그 밖의 이 제도의 연속성 유지 및 가입자 보호를 위하여 필요한 업무


제8장 운용현황의 통지 및 가입자 교육

제30조(운용현황의 통지) ① 사용자는 운용관리기관으로 하여금 이 제도의 적립금액 및 운용수익률 등의 운용현황을 매년 1회 이상 가입자에게 통지하도록 하여야 한다.
 ② 제1항에 따른 운용현황의 통지는 다음 각 호의 어느 하나에 해당하는 방법으로 이루어져야 한다.
  1. 우편 발송
  2. 서면 교부
  3. 정보통신망에 의한 전송
  4. 그 밖에 이에 준하는 방식으로 사용자와 운용관리기관이 체결한 운용관리업무에 관한 계약에서 정한 방법

제31조(가입자 교육) ① 사용자는 매년 1회 이상 가입자에게 이 제도의 운영상황 등 다음 각 목의 사항에 대하여 교육을 실시하여야 한다.
  1. 제도 일반에 관한 교육사항
   가. 급여 종류에 관한 사항, 수급요건, 급여액 등 제도별 특징 및 차이점
   나. 담보대출, 지연이자 등 해당 사업의 퇴직연금제도 운영에 관한 사항
   다. 급여 또는 부담금 산정의 기준이 되는 임금 등에 관한 사항
   라. 퇴직 시 급여 지급절차 및 개인형퇴직연금제도로의 적립금 이전에 관한 사항
   마. 연금소득세, 퇴직소득세 등 과세 체계에 관한 사항
   바. 해당 사업의 퇴직연금제도를 중단하거나 폐지하는 경우 그 처리방법
   사. 가입자의 소득, 자산, 부채, 나이 및 근속연수 등을 고려한 자산·부채관리의 일반적 원칙과 노후 설계의 중요성에 관한 사항
  2. 이 제도의 설정에 따른 추가 교육사항
   가. 최근 3년간의 부담금 납입현황
   나. 급여종류별 표준적인 급여액 수준
   다. 직전 사업연도 말 기준 최소적립금 대비 적립금 현황
   라. 재정안정화계획서를 작성하는 경우 그 계획서의 내용 및 이행 상황
   마. 그 밖에 적립금 운용현황, 운용목표 등에 관한 사항
 ② 제1항에 따른 교육의 방법 및 절차에 관한 사항은 다음 각 호의 구분에 따른다.
  1. 제1항제1호의 제도 일반에 관한 교육사항은 사내 정보통신망 또는 사업장 게시판 게시 등을 가입자가 수시로 열람할 수 있도록 한다. 다만 이 제도 설정 후 최초 교육은 교육자료를 우편으로 발송하거나 직원연수·조회·회의·강의 등 대면하여 전달하는 방식으로 실시한다.
  2. 제1항제2호의 이 제도의 설정에 따른 추가 교육사항은 다음 각 목 중 하나 이상의 방법으로 실시한다.
   가. 서면 또는 전자우편 등을 통한 정기적인 교육자료의 발송
   나. 직원연수·조회·회의·강의 등의 대면 교육의 실시
   다. 정보통신망을 통한 온라인 교육의 실시
   라. 해당 사업장 게시판 등에 상시 게시${d.educationDelegate!==false?`\n ③ 사용자는 퇴직연금사업자에게 제1항 및 제2항에 따른 교육의 실시를 위탁할 수 있다.\n ④ 제3항에 따라 퇴직연금사업자에게 가입자 교육의 실시를 위탁하는 경우 사용자는 퇴직연금사업자와 교육시기, 교육내용, 구체적 교육방법 등을 포함한 계약을 체결하여 퇴직연금사업자로 하여금 위탁계약의 내용에 따라 교육을 실시하도록 하여야 한다.\n ⑤ 사용자는 제3항 및 제4항에 따라 교육의 실시를 위탁한 경우 교육의 실시를 위하여 필요한 사항에 협조하고, 그 실시 결과를 확인하여야 한다.`:""}


제9장 기타

제32조(수급권의 보호) ① 가입자는 이 제도의 급여를 받을 권리를 양도 또는 압류하거나 담보로 제공할 수 없다.
 ② 제1항에도 불구하고 가입자는 다음 각 호의 어느 하나에 해당하는 사유와 요건을 갖춘 경우에는 이 제도의 급여를 받을 권리를 담보로 제공할 수 있다.
  1. 무주택자인 가입자가 본인 명의로 주택을 구입하는 경우
  2. 무주택자인 가입자가 주거를 목적으로 「민법」 제303조에 따른 전세금 또는 「주택임대차보호법」 제3조의2에 따른 보증금을 부담하는 경우. 이 경우 가입자가 하나의 사업 또는 사업장(이하 "사업"이라 한다)에 근로하는 동안 1회로 한정한다.
  3. 가입자가 6개월 이상 요양을 필요로 하는 다음 각 목의 어느 하나에 해당하는 사람의 질병이나 부상에 대한 의료비(「소득세법 시행령」 제118조의5제1항 및 제2항에 따른 의료비를 말한다)를 부담하는 경우
   가. 가입자 본인
   나. 가입자의 배우자
   다. 가입자 또는 그 배우자의 부양가족(「소득세법」 제50조제1항제3호에 따른 부양가족을 말한다. 이하 같다)
  4. 담보를 제공하는 날부터 거꾸로 계산하여 5년 이내에 가입자가 「채무자 회생 및 파산에 관한 법률」에 따라 파산선고를 받은 경우
  5. 담보를 제공하는 날부터 거꾸로 계산하여 5년 이내에 가입자가 「채무자 회생 및 파산에 관한 법률」에 따라 개인회생절차개시 결정을 받은 경우
  6. 다음 각 목의 어느 하나에 해당하는 사람의 대학등록금, 혼례비 또는 장례비를 가입자가 부담하는 경우
   가. 가입자 본인
   나. 가입자의 배우자
   다. 가입자 또는 그 배우자의 부양가족
  7. 그 밖에 천재지변 등으로 피해를 입는 등 고용노동부장관이 정하여 고시하는 사유와 요건에 해당하는 경우
 ③ 제2항에 따른 담보제공의 한도는 다음 각 호의 구분에 따른다.
  1. 제2항제1호부터 제6호까지의 경우: 가입자별 적립금의 100분의 50

제10조(퇴직연금사업자의 변경) ① 사용자는 확정급여형퇴직연금제도의 운용관리기관 및 자산관리기관을 변경하고자 하는 경우 근로자대표의 의견을 들어야 한다.
 ② 사용자는 확정기여형퇴직연금제도의 운용관리기관 및 자산관리기관을 새로 추가하고자 하는 경우에는 근로자대표의 의견을 들어야 하며, 변경하고자 하는 경우에는 근로자대표의 동의를 받아야 한다.

제11조(퇴직연금사업자 선정·변경 시 사용자 책무) 사용자는 제7조 또는 제8조에 따른 퇴직연금사업자를 선정하거나 변경하는 경우, 관련 서비스 제공 등 퇴직연금제도 전반에 대한 능력과 전문성을 종합적으로 판단하여 정하여야 한다.


제3장 가입자 및 가입기간

${a12}

제13조(가입자 자격 취득 및 상실) ① 이 제도 설정 이후 가입대상이 되는 날을 가입자 자격 취득일로 본다.
 ② 다음 각 호에 해당하게 되는 날의 다음 날을 가입자 자격 상실일로 본다.
  1. 가입자가 사망한 때
  2. 퇴직, 해고, 그 밖에 취업규칙 또는 별도로 정하는 규정에 따른 사유로 고용 관계가 종료된 때
  3. 이 제도를 폐지한 때
 ③ 사용자는 가입자의 자격 취득 또는 상실 사유가 발생한 경우 그 사실을 운용관리기관${ib}에 전달하여 가입자 등재 및 상실 등의 업무처리가 이뤄지도록 하여야 한다.

${a14}


제4장 급여 및 부담금 수준, 부담금 납입

제15조(확정급여형퇴직연금제도 급여수준) ① 확정급여형퇴직연금제도에 따른 급여수준은 가입자의 퇴직일을 기준으로 산정한 일시금이 계속근로기간 1년에 대하여 30일분의 평균임금에 상당하는 금액이 되도록 한다.
 ② 제1항의 평균임금은 근로기준법령에서 정해진 바에 따라 계산한다.${wpC}

제16조(확정급여형퇴직연금제도 부담금의 산정 및 납입) ① 사용자는 확정급여형퇴직연금제도의 가입자에게 제15조에서 정한 급여수준에 따른 급여를 지급하기 위해 매년 1회 이상 정기적으로 부담금을 납입하여야 한다.
 ② 제1항에 따른 부담금은 자산관리기관에 매년 ${h((d.contribMonth||"12")+"월 "+(d.contribDay||"31")+"일")}까지 납입한다.
 ③ 사용자는 재정균형을 장기적으로 유지할 수 있도록 운용관리업무를 수행하는 퇴직연금사업자${multiDB?"(복수인 경우 간사기관)":""}에게 관련 법령의 산정방식에 따라 부담금을 적정하게 산출하여 줄 것을 요청하여야 한다.
 ④ 사용자는 제3항에 따른 부담금을 산출하는데 필요한 단체협약, 취업규칙, 급여명세서, 근로계약서 등의 자료를 퇴직연금사업자에게 제공하여야 한다.

제17조(확정기여형퇴직연금제도 부담금의 산정) ① 사용자는 가입자의 연간 임금총액의 ${h(d.contributionRate||"12분의 1")}에 해당하는 금액을 통화로 가입자의 확정기여형퇴직연금제도 계정에 납입하여야 한다.
 ② 제1항의 연간 임금총액이라 함은 사용자가 가입자에게 지급한 근로기준법상 임금에 해당하는 금품의 연간 합계액을 말한다.${d.retroactive!=="none"?`
 ③ 제1항에도 불구하고 과거근로기간에 대한 부담금은 과거근로기간을 가입기간에 포함하기로 한 시점을 기준으로 산정하되, 아래 각 호의 금액 중 큰 금액을 부담금으로 납입하여야 한다.
  1. 과거근로기간 1년에 대하여 기준시점 이전 1년간 지급받은 임금총액의 12분의 1에 상당하는 금액
  2. 과거근로기간 1년에 대하여 기준시점을 산정사유 발생일로 하여 산정한 30일분 평균임금에 상당하는 금액`:""}
 ${d.retroactive!=="none"?"④":"③"} 부담금 산정기간 중에 다음 각 호의 어느 하나에 해당하는 기간이 있는 경우, 제1항에 따른 부담금은 해당 기간에 지급된 임금을 제외한 연간 임금총액을 해당 기간을 제외한 연간 기간으로 나누어 산정한다. 다만 근로자 개인사유로 사용자의 승인을 받은 휴직의 경우 취업규칙 등을 통해 별도로 정한 바가 있는 경우 이에 따른다.
  1. 「근로기준법 시행령」제2조제1항 각 호의 어느 하나에 해당하는 기간
  2. 「남녀고용평등과 일·가정 양립 지원에 관한 법률」 제18조의3에 따른 난임치료휴가기간 중 무급기간
  3. 「남녀고용평등과 일·가정 양립 지원에 관한 법률」제19조의2에 따른 육아기 근로시간 단축 기간
  4. 「남녀고용평등과 일·가정 양립 지원에 관한 법률」제22조의2에 따른 가족돌봄 휴직 또는 휴가 기간
  5. 「남녀고용평등과 일·가정 양립 지원에 관한 법률」제22조의3에 따른 가족돌봄 근로시간 단축 기간
 ${d.retroactive!=="none"?"⑤":"④"} 가입자는 제1항에 따른 사용자 부담금 외에 스스로 부담하는 추가 부담금을 본인의 확정기여형퇴직연금제도 계정에 납입할 수 있다.
 ${d.retroactive!=="none"?"⑥":"⑤"} 제 12조에 의하여 가입한 임원에 대한 부담금 산정은 이 사업 내에 임원퇴직금지급규정 등 별도로 정한 규정이 있는 경우 이에 따른다.${d.performanceDC&&d.perfCriteria!=="other"?(()=>{
    const pn=d.retroactive!=="none";
    const perfArtN=pn?"⑦":"⑥";
    const perfRefN=pn?"7":"6";
    const ts='style="border:1px solid #999;padding:4px 10px;text-align:center;font-size:12px;"';
    const th='style="border:1px solid #999;padding:4px 10px;text-align:center;font-size:12px;background:#f3f4f6;font-weight:bold;"';
    let tableHtml="";
    const tiers=d.perfTiers||[{label:"16년 이상",rate:"50"},{label:"7~15년",rate:"40"},{label:"1~6년",rate:"30"}];
    const hdrCells=tiers.map(t=>`<td ${th}>근속기간(${h(t.label)})</td>`).join("");
    const dcCells=tiers.map(t=>`<td ${ts}>${h(t.rate+"%")}</td>`).join("");
    const cashCells=tiers.map(t=>`<td ${ts}>${h((100-Number(t.rate||0))+"%")}</td>`).join("");
    const execSection=d.includeExecutives&&d.perfRateExec?`<p style="font-size:12.5px;font-weight:bold;margin:16px 0 6px;">＜임원 납입 비율＞</p><p style="font-size:12px;margin:4px 0;">임원 : 경영성과급 DC 납입비율 (단일율)</p><p style="font-size:12px;margin:4px 0;">단일율 : ${h(d.perfRateExec+"%")}</p><p style="font-size:11px;color:#666;margin:6px 0 0;font-style:italic;">단, 임원의 경우 위의 납입비율에 해당하는 금액이 세법상 임원 퇴직소득한도를 초과하는 경우에는 임원 퇴직소득한도 내에서 납부할 수 있다.</p>`:"";
    tableHtml=`</pre><div style="margin:12px 0;"><p style="font-size:12.5px;font-weight:bold;margin-bottom:6px;">＜직원 납입 비율＞</p><table style="border-collapse:collapse;width:auto;"><tr><td ${th}>구분</td>${hdrCells}</tr><tr><td ${ts}>DC 적립 비율</td>${dcCells}</tr><tr><td ${ts}>현금 지급 비율</td>${cashCells}</tr></table>${execSection}</div><pre style="font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;font-family:'D2Coding','Nanum Gothic Coding',monospace;margin:0;color:#1f2937;">`;
    return `\n ${perfArtN} 사용자는 제1항에 따른 사용자 부담금 외에 이 사업의 경영실적 등에 따라 지급여부 및 지급액이 결정되는 급여(이하 "경영성과급"이라 한다.)를 제12조에 따른 가입자 자격을 취득하는 날부터 다음의 납입비율로 가입자의 확정기여형퇴직연금제도 계정에 추가 납입하여야 한다.${tableHtml}\n ${pn?"⑧":"⑦"} 제${perfRefN}항에도 불구하고 가입자는 다음 각 호에 해당하는 날에 경영성과급을 향후 적립하지 아니할 것을 선택할 수 있다.\n  1. 이 사업에 제${perfRefN}항의 적립방식이 최초로 설정되는 날 (이 사업에 최초로 근무하게 된 날에 제${perfRefN}항의 적립 방식이 이미 설정되어 있는 경우에는 제12조에 따른 가입 대상이 되는 날)\n  2. 제${perfRefN}항의 적립방식이 변경되는 날\n ${pn?"⑨":"⑧"} 가입자는 제${perfRefN}항에 따른 납입 비율을 임의로 변경하거나, 납입 중단 또는 추가 납입을 임의로 선택할 수 없다.`;
  })():""}

제18조(확정기여형퇴직연금제도 부담금의 납입) ① 사용자는 제17조제1항에 따른 부담금을 ${h(payLabel)}까지 정기적으로 가입자의 확정기여형퇴직연금제도 계정에 납입하여야 한다.${d.retroactive!=="none"?`
 ② 사용자는 제17조제3항에 따른 부담금을 과거근로기간을 가입기간에 포함시킨 날에 일시 납입하여야 한다.`:""}
 ${d.retroactive!=="none"?"③":"②"} 제17조제${d.retroactive!=="none"?"5":"4"}항에 따른 추가 부담금은 가입자가 자산관리기관에 직접 납부할 수 있다.

제19조(확정기여형퇴직연금제도 부담금 미납 시 처리) ① 사용자가 제17조제1항에 따른 부담금을 제18조제1항에 따라 정하여진 기일(이하 "정기 납입일"이라 한다)까지 납입하지 아니한 경우 정기 납입일로부터 ${h(ext)}이 되는 날까지 납부기간을 연장한다.
 ② 법 제20조제3항 후단에 따라 제1항에 따라 연장된 기일까지 제17조제1항에 따른 부담금을 납입한 경우 지연이자는 적용하지 아니한다.
 ③ 사용자가 제1항에 따라 연장된 기일까지 제17조제1항에 따른 부담금을 납입하지 아니하는 경우 그 연장된 기일 다음 날부터 부담금을 납입한 날까지 지연 일수에 대하여 다음 각 호의 구분에 따른 지연이자율을 적용하여 납입하여야 한다.
  1. 제1항에 따라 연장된 납입 기일의 다음 날을 기산일로 하여 가입자의 퇴직 등 급여를 지급할 사유가 발생한 날부터 14일까지의 기간: 연 100분의 10
  2. 제1호에 따른 기간의 다음 날부터 부담금을 납입하는 날까지의 기간: 연 100분의 20
 ④ 제3항에도 불구하고 「근로자퇴직급여 보장법 시행령」(이하 "영"이라 한다) 제12조에 따라 지연이자의 적용제외 사유가 있는 경우에는 지연이자를 적용하지 아니한다.


제5장 급여

제20조(급여의 종류 및 수급요건) 이 제도에 따른 급여의 종류는 연금 또는 일시금으로 하되, 수급요건은 다음 각 호와 같다.
  1. 연금은 55세 이상으로서 가입기간이 10년 이상인 가입자에게 지급할 것. 이 경우 연금의 지급기간은 5년 이상이어야 한다.
  2. 일시금은 연금수급 요건을 갖추지 못하거나 일시금 수급을 원하는 가입자에게 지급할 것

제21조(급여의 지급사유 발생) ① 급여의 지급사유는 이 제도의 가입자가 제13조제2항제1호부터 제3호까지의 어느 하나에 해당되어 가입자 자격을 상실하게 된 경우 발생한다.${d.excludeUnder1YearBenefit?`\n ② 제1항에도 불구하고 계속근로기간이 1년 미만인 가입자가 그 자격을 상실한 경우에는 급여의 지급사유에 해당하지 아니한다.`:""}

제22조(확정급여형퇴직연금제도 급여 지급기한 등) ① 사용자는 급여를 지급할 사유가 발생한 날부터 14일 이내에 퇴직연금사업자로 하여금 적립금의 범위에서 급여지급의무가 있는 급여 전액을 지급하도록 하여야 한다.
 ② 사용자는 제1항에도 불구하고 특별한 사정이 있는 경우에는 가입자 및 퇴직연금사업자와 합의하여 지급기일을 연장할 수 있다.
 ③ 사용자는 제1항에도 불구하고 영 제8조 각 호의 사유에 해당하는 경우 퇴직연금사업자로 하여금 법 제16조제1항제2호에 따른 금액에 대한 적립금의 비율에 해당하는 금액을 지급하도록 하여야 한다.
 ④ 사용자는 제3항에 따라 퇴직연금사업자가 지급하는 급여수준이 제15조에 따른 급여수준에 미치지 못할 때에는 급여를 지급할 사유가 발생한 날부터 14일 이내에 그 부족한 금액을 해당 근로자에게 지급하여야 한다.

제23조(확정기여형퇴직연금제도 급여 지급기한 및 미납 부담금 등의 납입) ① 사용자는 급여를 지급할 사유가 발생한 경우 14일 이내에 제17조에 따른 부담금을 가입자의 이 제도 계정에 납입하여야 한다.
 ② 사용자는 제19조제1항에 따른 미납 부담금이 있는 경우에는 그 미납 부담금과 제19조제3항에 따른 지연이자를 급여를 지급할 사유가 발생한 날부터 14일 이내에 해당 가입자의 이 제도의 계정에 납입하여야 한다.
 ③ 사용자는 제1항 및 제2항에도 불구하고 특별한 사정이 있는 경우 가입자와의 합의에 따라 납입 기일을 연장할 수 있다.

제24조(급여의 지급) ① 사용자는 제22조 및 제23조의 급여를 지급하는 경우 가입자가 지정한 개인형퇴직연금제도의 계정 또는 중소기업퇴직연금기금제도의 가입자명의의 부담금 계정(이하 "개인형퇴직연금제도의 계정등"이라 한다)으로 이전하는 방법으로 한다.
 ② 가입자는 이 제도 가입 이후 7일 이내에 제1항에 따른 급여를 이전받기 위한 개인형퇴직연금제도의 계정등을 설정하고 그 확인자료(퇴직연금사업자가 발급한 개인형퇴직연금제도 계정 확인서 등. 이하 "개인형퇴직연금제도 확인서"라 한다)를 사용자에게 제출하는 등의 방법으로 지정의 의사를 표시하여야 한다.
 ③ 제21조에 따른 급여 지급사유 발생이 예정되거나 발생했음에도 불구하고 가입자가 개인형퇴직연금제도의 계정등을 지정하지 아니한 경우, 사용자는 제1항에 따라 급여가 이전될 수 있도록 가입자에게 개인형퇴직연금제도의 계정등을 지정할 것을 신속히 안내하여야 한다.
 ④ 제2항 및 제3항에도 불구하고 급여를 지급할 사유가 발생한 날부터 7일 이내에 가입자가 개인형퇴직연금제도의 계정등을 지정하지 아니하는 경우에는 법 제17조제5항에 따라 "가입자 명의의 개인형퇴직연금제도"계정등으로 이전한다. 이 경우 가입자가 해당 퇴직연금사업자에게 개인형퇴직연금제도를 설정한 것으로 본다.
 ⑤ 제4항에 따른 "해당 퇴직연금사업자"란 이 제도에 따라 가입자의 혼합형퇴직연금제도의 계정이 설정되었던 자산관리기관을 말한다.
 ⑥ 제1항에도 불구하고 영 제9조 각 호의 사유에 해당하는 경우에는 개인형퇴직연금제도의 계정등으로의 이전 이외의 방법으로 급여를 지급할 수 있다.

제25조(급여의 지급절차) ① 사용자는 급여를 지급할 사유가 발생한 경우 제24조에 따른 개인형퇴직연금제도의 계정등으로 급여를 이전할 것을 운용관리기관(확정급여형퇴직연금제도의 운용관리기관이 복수일 경우 간사기관)에 지시하여야 한다.
 ② 사용자는 제1항에 따라 급여의 지급을 지시할 때에는 가입자가 제출한 개인형퇴직연금제도 확인서를 첨부하여야 한다. 다만 제24조제4항의 경우에는 그러하지 아니하다.
 ③ 사용자는 운용관리기관(확정급여형퇴직연금제도의 운용관리기관이 복수일 경우 간사기관)으로 하여금 급여의 지급사유 발생 사실 등을 자산관리기관에 전달하도록 하여 가입자의 개인형퇴직연금제도의 계정등으로 급여가 이전될 수 있도록 하여야 한다.
 ④ 사용자는 확정급여형퇴직연금제도의 운영에 있어 운용관리기관이 복수인 경우 간사기관이 다른 운용관리기관에도 급여의 지급사유 발생 사실 등을 전달하도록 하여 필요한 업무 협조가 이루어질 수 있도록 하여야 한다.
 ⑤ 사용자는 가입자가 퇴직연금사업자에 직접 급여를 청구한 경우에는 퇴직연금사업자가 지체 없이 그 내용을 사용자에게 알리도록 하여 제1항에 따른 지급 지시가 이루어질 수 있도록 하여야 한다.
 ⑥ 제1항에도 불구하고 사업의 도산 등으로 사용자를 통한 급여의 지급절차 진행이 곤란한 경우 가입자는 퇴직연금사업자에게 직접 급여를 청구할 수 있다.
 ⑦ 확정기여형퇴직연금제도에 있어 가입자는 퇴직할 때에 받을 급여를 갈음하여 그 운용 중인 자산을 가입자가 설정한 개인형퇴직연금제도의 계정등으로 이전해 줄 것을 해당 퇴직연금사업자에게 요청할 수 있다.
 ⑧ 제7항에 따른 가입자의 요청이 있는 경우 퇴직연금사업자는 그 운용 중인 자산을 가입자의 개인형퇴직연금제도 계정등으로 이전하여야 한다. 이 경우 확정기여형퇴직연금제도 운용에 따른 가입자에 대한 급여는 지급된 것으로 본다.


제6장 확정급여형퇴직연금제도 급여 지급능력의 확보

제26조(부담금의 산정, 납입 및 급여 지급능력 확보) ① 사용자는 이 제도의 가입자에게 제15조에서 정한 급여수준에 따른 급여를 지급하기 위해 매년 1회 이상 정기적으로 부담금을 납입하여야 한다.
 ② 사용자는 급여 지급능력을 확보하기 위하여 매 사업연도 말 법 제16조제1항 본문에 따른 기준책임준비금에 100분의 100을 곱하여 산출한 금액(이하 "최소적립금"이라 한다) 이상을 적립금으로 적립하여야 한다.
 ③ 제2항에도 불구하고 과거근로기간을 가입기간에 포함한 경우에는 법 제16조제1항 단서에 따라 법 제16조제1항 본문에 따른 기준책임준비금에 과거근로기간의 연수(年數)와 가입 후 연차(年次)의 구분에 따라 고용노동부 고시로 정한 비율을 곱하여 산출한 금액 이상을 적립금으로 적립하여야 한다.
 ④ 사용자는 운용관리기관(운용관리기관이 복수인 경우 간사기관)이 매 사업연도 종료 후 6개월 이내에 영 제6조에 따른 재정검증을 실시할 수 있도록 하여야 한다.
 ⑤ 사용자는 영 제6조에 따른 재정검증을 하는데 필요한 단체협약, 취업규칙, 급여명세서, 근로계약서 등의 자료를 사업연도 종료 후 3개월 이내에 운용관리기관(운용관리기관이 복수인 경우 간사기관)에게 제공하여야 한다. 이 경우 사용자는 자료를 고의로 누락하거나 거짓으로 작성하여 제공해서는 안 된다.

제27조(재정검증결과 통보 협조) ① 영 제6조에 따른 재정검증 결과 적립금이 최소적립금보다 적은 경우 퇴직연금사업자가 전체 근로자에게 그 결과를 서면 또는 정보통신망에 의한 방법으로 알리기 위하여 사용자에게 다음 각 호의 사항을 협조 요청하는 경우 사용자는 특별한 사유가 없는 한 협조하여야 한다.
  1. 사용자가 운영하는 사내 전산망에 대한 이용 제공
  2. 전체 근로자의 주소 또는 전자우편 주소의 제공
  3. 사용자에게 서면 또는 정보통신망을 활용하여 전체 근로자를 대상으로 재정검증결과를 통보하는 행위의 수행
 ② 다만 제1항에도 불구하고 근로자의 과반수가 가입한 노동조합이 있는 경우 그러하지 아니하다.

제28조(적립 부족의 해소) 사용자는 영 제6조에 따른 재정검증 결과 적립금이 최소적립금의 95%에 미치지 못하는 것으로 확인된 경우 다음 각 호의 조치를 하여야 한다.
  1. 사용자는 부담금 납입 등을 통해 최소적립금 대비 부족분 비율의 3분의 1 이상을 직전 사업연도 종료 후 1년 이내에 해소하여야 한다.


제7장 확정기여형퇴직연금제도 적립금의 운용

제29조(적립금 운용방법 선정 및 운용지시) ① 가입자는 운용관리기관이 제시한 적립금 운용방법 중에서 스스로의 선택으로 운용방법을 선정할 수 있고, 반기 1회 이상 이를 변경할 수 있다.
 ② 가입자는 제1항에 따라 적립금 운용방법을 선정하거나 변경하고자 하는 경우 운용관리기관이 정하는 절차 및 방법에 따라 운용지시를 하여야 한다.
 ③ 사용자는 가입자가 적립금 운용방법을 변경하는 경우 중도해지이율 적용 또는 중도해지에 따른 수수료 등의 부담에 관한 구체적 내용을 운용관리기관으로 하여금 가입자에게 안내하도록 하여야 한다.

제30조(적립금 운용방법 제시) ① 사용자는 운용관리기관으로 하여금 반기마다 1회 이상 위험과 수익구조가 서로 다른 세 가지 이상의 적립금 운용방법을 가입자에게 제시하도록 하여야 한다.
 ② 사용자는 운용관리기관이 제1항에 따라 적립금의 운용방법을 제시함에 있어 다음 각 호의 요건을 갖춘 운용방법을 제시하도록 하여야 한다.
  1. 운용방법에 관한 정보의 취득과 이해가 쉬울 것
  2. 운용방법 간의 변경이 쉬울 것
  3. 적립금 운용결과의 평가 방법과 절차가 투명할 것
  4. 영 제25조제1항에 따른 원리금보장 운용방법이 하나 이상 포함될 것

제31조(적립금 운용방법의 정보제공) ① 사용자는 운용관리기관으로 하여금 다음 각 호에서 정한 사항을 포함하여 가입자가 적립금 운용방법을 선정하는 데 필요한 정보를 제공하도록 하여야 한다.
  1. 운용방법별 이익 및 손실의 가능성
  2. 운용방법별 과거 3년간의 이익 또는 손실 관련 실적. 다만 해당 운용방법의 과거 취급기간이 3년에 미치지 못하는 경우에는 그 취급기간에 한한다.
  3. 운용방법의 선정 또는 변경에 따라 발생하는 운용수탁보수, 중도해지 또는 환매수수료 등의 비용 및 그 부담 방법에 관한 사항
  4. 예금자보호법에 의한 보호대상 등 지급보장의 정도
  5. 그 밖에 가입자가 운용지시를 하는 데 필요한 정보
 ② 사용자는 운용관리기관이 다음 각 호의 어느 하나에 해당하는 방법으로 적립금 운용방법에 관한 정보를 가입자에게 제공하도록 하여야 한다.
  1. 우편 발송
  2. 서면 교부
  3. 정보통신망에 의한 전송
 ③ 사용자는 운용관리기관으로 하여금 가입자에게 매 반기 1회 이상 정기적으로 제1항에 따른 적립금 운용방법의 제시 및 운용방법에 관한 정보의 제공을 하도록 하여야 한다.

제32조(사전지정운용방법의 선정) ① 가입자는 제29조에 따른 운용방법 선정과 별도로 운용관리기관이 [별지]에 따라 제시하는 사전지정운용방법 중 하나를 본인이 적용받을 사전지정운용방법으로 선정해야 한다.
 ② 가입자는 제1항에서 선정한 사전지정운용방법을 변경할 수 있다.

제32조의2(사전지정운용방법에 대한 정보제공) ① 사용자는 가입자가 제32조에 따른 사전지정운용방법을 선정할 수 있도록 운용관리기관으로 하여금 [별지]의 사전지정운용방법에 대하여 다음 각 호의 사항에 관한 정보를 제공하게 하여야 한다.
  1. 해당 사전지정운용방법의 자산배분 현황 및 위험·수익 구조
  2. 법 제21조의3제2항부터 제5항에 따른 사전지정운용제도의 운영에 대한 내용
  3. 위험등급, 손실가능성 및 과거수익률
  4. 수수료 등 가입자가 부담하는 비용에 관한 사항
  5. 예금자 보호 한도 등 가입자의 보호에 관한 사항
  6. 사전지정운용방법의 적용에 따른 퇴직연금자산의 위험도 변경 가능성
  7. 법 제21조의3제6항에 따라 사전지정운용방법이 변경될 수 있다는 사실과 그 절차
  8. 사전지정운용방법의 승인일자 등 승인에 관한 사항
  9. 기타 고용노동부장관이 정하는 사항
 ② 사용자는 운용관리기관이 제1항에 따른 정보를 서면 또는 정보통신망 등에 의한 방법으로 알릴 수 있도록 가입자에 관한 정보 제공에 협조해야 한다.

제32조의3(사전지정운용방법 적용의 통지) 사용자는 제29조제1항에 따른 적립금 운용방법을 선정하지 않은 가입자가 다음 각 호에 해당하는 경우, 운용관리기관으로 하여금 제32조에 따라 가입자가 선정한 사전지정운용방법으로 적립금이 운용됨을 통지하도록 하여야 한다.
  1. 가입자가 이 제도에 가입하고 사용자가 제17조에 따른 부담금을 최초로 납입한 때
  2. 가입자가 제29조제1항에 따라 스스로 선정한 적립금 운용방법의 기간 만료일부터 4주가 지났을 때

제32조의4(사전지정운용방법의 적용) ① 가입자가 제32조의3에 따른 통지를 받은 이후에도 별도의 운용지시 없이 2주가 경과한 경우 제32조제1항에 따라 본인이 선정한 사전지정운용방법으로 적립금이 운용된다.
 ② 제1항에 따라 적립금을 운용하는 가입자는 언제든지 제29조에 따라 적립금 운용방법을 스스로 선정할 수 있다.

제32조의5(사전지정운용방법의 변경) 사용자는 운용관리기관이 [별지]에 따른 사전지정운용방법 중 어느 하나에 대하여 고용노동부 장관으로부터 변경 승인을 받은 경우, 운용관리기관으로 하여금 변경 승인을 받은 날부터 7일 이내에 해당 사전지정운용방법을 본인이 적용받을 사전지정운용방법으로 선정하였거나 운용하고 있는 가입자에게 다음 각 호의 내용을 포함하여 통지하도록 해야 한다.
  1. 사전지정운용방법 변경 사유
  2. 변경되는 사전지정운용방법에 관한 정보로서 제32조의2제1항 각 호에 관한 사항
  3. 사전지정운용방법 변경에 대한 고용노동부장관의 승인 사실
  4. 가입자의 적립금이 변경된 사전지정운용방법으로 운용된다는 사실
  5. 변경된 사전지정운용방법으로 운용된 이후 가입자는 언제든지 스스로 운용방법을 선정할 수 있다는 사실

제32조의6(사전지정운용방법 취소) ① 사용자는 [별지]에 따른 사전지정운용방법이 고용노동부장관으로부터 승인 취소된 경우에는 운용관리기관으로 하여금 해당 사전지정운용방법을 본인이 적용받을 사전지정운용방법으로 선정하였거나 해당 사전지정운용방법으로 적립금이 운용되고 있는 가입자에게 다음 각 호의 사항을 통지하도록 해야 한다.
  1. 승인 취소 사유
  2. 승인 취소된 사전지정운용방법의 해지 방법·절차에 관한 사항
  3. 다른 사전지정운용방법을 포함한 3가지 이상의 운용방법에 관한 정보로서 제32조의2 제1항 각 호에 관한 정보
 ② 제1항의 조치에도 불구하고 가입자가 해당 사전지정운용방법을 해지하지 않거나 다른 운용방법을 선택하지 않을 경우 퇴직연금사업자로 하여금 가입자의 적립금을 같은 위험등급의 다른 사전지정운용방법으로 이전하여 운용할 수 있다는 사실을 통지하도록 해야 한다.
 ③ 제2항에 따라 적립금을 운용하는 경우 퇴직연금사업자로 하여금 다음 각 호의 사항을 통지하도록 해야 한다.
  1. 적립금을 이전하여 운용한다는 사실
  2. 적립금을 이전한 운용방법에 관한 정보로서 제32조의2 제1항 각 호에 관한 정보


제8장 수급권의 보호 및 중도인출

제33조(수급권의 보호) ① 가입자는 이 제도의 급여를 받을 권리를 양도 또는 압류하거나 담보로 제공할 수 없다.
 ② 제1항에도 불구하고 가입자는 다음 각 호의 어느 하나에 해당하는 사유와 요건을 갖춘 경우에는 이 제도의 급여를 받을 권리를 담보로 제공할 수 있다.
  1. 무주택자인 가입자가 본인 명의로 주택을 구입하는 경우
  2. 무주택자인 가입자가 주거를 목적으로 「민법」 제303조에 따른 전세금 또는 「주택임대차보호법」 제3조의2에 따른 보증금을 부담하는 경우. 이 경우 가입자가 하나의 사업에 근로하는 동안 1회로 한정한다.
  3. 가입자가 6개월 이상 요양을 필요로 하는 다음 각 목의 어느 하나에 해당하는 사람의 질병이나 부상에 대한 의료비(「소득세법 시행령」 제118조의5제1항 및 제2항에 따른 의료비를 말한다. 이하 같다.)를 부담하는 경우
   가. 가입자 본인
   나. 가입자의 배우자
   다. 가입자 또는 그 배우자의 부양가족(「소득세법」제50조제1항제3호에 따른 부양가족을 말한다. 이하 같다.)
  4. 담보를 제공하는 날부터 거꾸로 계산하여 5년 이내에 가입자가 「채무자 회생 및 파산에 관한 법률」에 따라 파산선고를 받은 경우
  5. 담보를 제공하는 날부터 거꾸로 계산하여 5년 이내에 가입자가 「채무자 회생 및 파산에 관한 법률」에 따라 개인회생절차개시 결정을 받은 경우
  6. 다음 각 목의 어느 하나에 해당하는 사람의 대학등록금, 혼례비 또는 장례비를 가입자가 부담하는 경우
   가. 가입자 본인
   나. 가입자의 배우자
   다. 가입자 또는 그 배우자의 부양가족
  7. 그 밖에 사업주의 휴업 실시로 근로자의 임금이 감소하거나 재난으로 피해를 입은 경우 등 고용노동부장관이 정하여 고시하는 사유와 요건에 해당하는 경우
 ③ 제2항에 따른 담보제공의 한도는 법령 및 고용노동부장관이 정하여 고시하는 한도에 따른다.
 ④ 사용자는 가입자가 대출을 받고자 하는 경우 퇴직연금사업자(자산관리기관)로부터 필요한 서류를 발급받을 수 있도록 하여야 한다.

제34조(중도인출) ① 가입자는 다음 각 호의 어느 하나에 해당하는 사유가 발생하면 적립금을 중도인출할 수 있다.
  1. 제33조제2항제1호, 제2호, 제7호(재난으로 피해를 입은 경우로 한정한다)에 해당하는 경우
  2. 제33조제2항제3호에 해당하는 경우로서 가입자가 본인 연간 임금총액의 1천분의 125를 초과하여 의료비를 부담하는 경우
  3. 중도인출을 신청한 날부터 거꾸로 계산하여 5년 이내에 가입자가 「채무자 회생 및 파산에 관한 법률」에 따라 파산선고를 받은 경우
  4. 중도인출을 신청한 날부터 거꾸로 계산하여 5년 이내에 가입자가 「채무자 회생 및 파산에 관한 법률」에 따라 개인회생절차개시 결정을 받은 경우
  5. 법 제7조제2항 후단에 따라 퇴직연금제도의 급여를 받을 권리를 담보로 제공하고 대출을 받은 가입자가 그 대출 원리금을 상환하기 위한 경우로서 고용노동부장관이 정하여 고시하는 사유에 해당하는 경우. 단, 그 중도인출 금액은 대출 원리금의 상환에 필요한 금액 이하로 한다.
 ② 가입자는 중도인출을 받고자 하는 경우 제1항의 어느 하나에 해당하는 사유를 갖추었음을 증빙할 수 있는 자료를 첨부하여 퇴직연금사업자에게 중도인출을 신청하여야 한다.


제9장 운용·자산관리업무 계약의 체결, 해지 및 이전

제35조(운용관리업무에 관한 계약의 체결) ① 사용자는 법 제28조에 따라 다음 각 호의 업무(이하 "운용관리업무"라 한다)를 하는 것을 내용으로 하는 계약을 제7조에서 선정한 운용관리기관과 체결하여야 한다.
  1. 가입자에 대한 적립금 운용방법 및 운용방법별 정보의 제공
  1의2. 사전지정운용제도의 설정 및 운영에 관한 업무
  2. 적립금 운용현황의 기록·보관·통지
  3. 가입자가 선정한 운용방법을 자산관리기관에게 전달하는 업무
  4. 그 밖에 운용관리업무의 적절한 수행을 위하여 필요한 업무
 ② 사용자는 운용관리업무에 관한 계약을 체결 또는 변경하는 경우 그 내용을 가입자에게 알려야 한다.

제36조(자산관리업무에 관한 계약의 체결) ① 사용자는 법 제29조에 따라 다음 각 호의 업무(이하 "자산관리업무"라 한다)를 하는 것을 내용으로 하는 계약을 제8조에서 선정한 자산관리기관과 체결하여야 한다.
  1. 계좌의 설정 및 관리
  2. 부담금의 수령
  3. 적립금의 보관 및 관리
  4. 운용관리기관이 전달하는 적립금 운용지시의 이행
  5. 급여의 지급
  6. 그 밖에 자산관리업무의 적절한 수행을 하는데 필요한 업무
 ② 사용자는 제1항에 따른 계약을 체결하려는 경우에는 가입자를 피보험자 또는 수익자로 하여 영 제24조에서 정하는 요건을 갖춘 보험계약 또는 신탁계약의 방법으로 하여야 한다.
 ③ 사용자는 자산관리업무에 관한 계약을 체결 또는 변경하는 경우 그 내용을 가입자에게 알려야 한다.

제37조(수수료의 부담) ① 사용자 부담금에 대한 운용관리 및 자산관리업무 수수료는 사용자가 부담한다.
 ② 가입자 추가 부담금에 대한 운용관리 및 자산관리업무 수수료는 가입자가 부담한다.
 ③ 사용자는 제2항에 따른 수수료율 및 부담방법 등 그 구체적 사항을 퇴직연금사업자로 하여금 가입자에게 알리도록 하여야 한다.

제38조(계약해지) 사용자는 다음 각 호의 어느 하나에 해당하는 경우에 제35조 및 제36조에 따른 계약을 해지할 수 있다.
  1. 이 제도의 폐지
  2. 퇴직연금사업자의 변경
  3. 퇴직연금사업자의 계약 위반
  4. 퇴직연금사업자의 등록취소 또는 등록말소

제39조(계약이전) 사용자는 제38조 제2호부터 제4호까지의 사유에 해당하는 경우 이 제도의 이전에 필요한 조치를 하여야 한다.


제10장 제도의 폐지·중단

제40조(제도의 폐지) ① 이 제도는 다음 각 호의 어느 하나에 해당하는 경우에 폐지할 수 있다.
  1. 사업의 폐업·소멸·도산
  2. 다른 퇴직급여제도로의 변경
 ② 사용자는 제1항에 따라 이 제도를 폐지하는 경우 근로자대표의 동의를 받아야 한다.
 ③ 사용자는 영 제38조제1호에 따라 폐지한 날부터 1개월 이내에 고용노동부장관에게 폐지신고서를 제출하여야 한다.
 ④ 사용자는 이 제도 폐지일을 기준으로 산정된 적립금, 적립부족액 및 가입자별 미납 부담금, 가입자별 급여 내역 및 지급절차, 중간정산 대상기간 등을 가입자에게 통지하여야 한다.
 ⑤ 사용자는 제4항에 따른 통지를 함에 있어 확정기여형퇴직연금제도의 미납 부담금이 있는 경우에는 그 금액과 지연이자를 포함한 금액, 납입 예정일 및 해소 방안도 함께 제시하여야 한다.
 ⑥ 사용자는 이 제도 폐지일부터 14일 이내에 확정기여형퇴직연금제도의 미납 부담금 및 지연이자를 퇴직연금사업자에게 납입한 후 퇴직연금사업자로 하여금 급여를 지급하도록 하는데 필요한 조치를 하여야 한다.

제41조(제도 폐지 시 급여 처리) ① 제40조에 따라 가입자가 급여를 받은 경우에는 법 제8조제2항에 따라 중간정산되어 받은 것으로 본다.
 ② 제1항에 따른 가입자별 중간정산금(확정급여형퇴직연금제도만 해당한다) 및 대상기간은 다음 각 호의 구분에 따른다.
  1. 확정급여형퇴직연금제도의 경우: 중간정산금은 이 제도에 따라 적립된 금액을 가입자별 근속기간·평균임금과 제15조에 따른 급여수준을 고려하여 안분·산정하고, 중간정산 대상기간은 중간정산금을 기준으로 환산
  2. 확정기여형퇴직연금제도의 경우: 중간정산 대상기간은 가입자별로 퇴직연금에 가입한 날부터 사용자가 납입한 부담금에 대응하는 기간의 마지막 날까지로 환산
 ③ 사용자는 이 제도의 폐지로 퇴직연금사업자로 하여금 가입자에게 급여를 지급하도록 하는 경우 제22조부터 제25조까지의 규정을 따른다.

제42조(제도의 운영중단) ① 사용자가 법 또는 이 규약에 위반되는 행위를 하여 고용노동부장관이 이 제도의 중단을 명한 경우 이 제도의 운용을 중단하기로 한다.
 ② 이 제도의 운용이 중단된 경우 중단된 기간에 대하여는 법 제8조제1항에 따른 퇴직금제도를 적용한다.
 ③ 사용자는 이 제도의 중단에도 불구하고 다음 각 호의 기본적인 업무는 유지하여야 한다.
  1. 가입자에게 제도 중단 사유 및 중단일, 재개시 일정, 미납 부담금이 있는 경우 그 납입계획 등 제도 중단기간의 처리방안 등의 공지
  2. 가입자 교육의 실시
  3. 급여 지급의 요청, 적립금 운용 등과 관련하여 법령 등에 규정된 업무의 이행을 위해 필요한 조치
  4. 그 밖에 이 제도의 연속성 유지 및 가입자 보호를 위하여 필요한 업무
 ④ 사용자는 이 제도의 중단에도 불구하고 퇴직연금사업자로 하여금 다음 각 호의 기본적인 업무를 유지하도록 하여야 한다.
  1. 가입자 퇴직 등에 따른 급여의 지급
  2. 가입자 교육을 위탁받은 경우 위탁받은 교육의 실시
  3. 급여의 지급, 적립금의 운용, 운용현황의 통지 등과 관련하여 법령 및 운용·자산관리업무의 계약에서 정해진 업무
  4. 그 밖의 이 제도의 연속성 유지 및 가입자 보호를 위하여 필요한 업무


제11장 운용현황의 통지 및 가입자 교육

제43조(운용현황의 통지) ① 사용자는 운용관리기관으로 하여금 확정급여형퇴직연금제도의 적립금액 및 운용수익률 등의 운용현황과 확정기여형퇴직연금제도의 가입자별 운용현황을 매년 1회 이상 가입자에게 통지하도록 하여야 한다. 확정기여형퇴직연금제도의 경우 가입자별 적립금의 운용수익 및 운용방법별 구성비율 등의 내용이 포함되어야 한다.
 ② 제1항에 따른 운용현황의 통지는 다음 각 호의 어느 하나에 해당하는 방법으로 이루어져야 한다.
  1. 우편 발송
  2. 서면 교부
  3. 정보통신망에 의한 전송
  4. 그 밖에 이에 준하는 방식으로 사용자와 운용관리기관이 체결한 운용관리업무에 관한 계약에서 정한 방법
 ③ 사용자는 제1항에 불구하고 확정기여형퇴직연금제도에서 다음 각 호의 어느 하나에 해당하는 사유가 발생한 경우에는 퇴직연금사업자로 하여금 운용현황의 구체적인 내용을 그 사유가 발생한 날부터 10일 이내에 가입자에게 알리도록 하여야 한다.
  1. 부담금이 납입 예정일부터 1개월 이상 미납된 경우
  2. 적립금 운용수익률이 현저히 변동한 경우로서 고용노동부장관이 정하는 기준에 해당하는 경우

제44조(가입자 교육) ① 사용자는 매년 1회 이상 가입자에게 이 제도의 운영상황 등 다음 각 목의 사항에 대하여 교육을 실시하여야 한다.
  1. 제도 일반에 관한 교육사항
   가. 급여 종류에 관한 사항, 수급요건, 급여액 등 제도별 특징 및 차이점
   나. 담보대출, 중도인출, 지연이자 등 해당 사업의 퇴직연금제도 운영에 관한 사항
   다. 급여 또는 부담금 산정의 기준이 되는 임금 등에 관한 사항
   라. 퇴직 시 급여 지급절차 및 개인형퇴직연금제도로의 적립금 이전에 관한 사항
   마. 연금소득세, 퇴직소득세 등 과세 체계에 관한 사항
   바. 해당 사업의 퇴직연금제도를 중단하거나 폐지하는 경우 그 처리방법
   사. 가입자의 소득, 자산, 부채, 나이 및 근속연수 등을 고려한 자산·부채관리의 일반적 원칙과 노후 설계의 중요성에 관한 사항
  2. 확정급여형퇴직연금제도의 설정에 따른 추가 교육사항
   가. 최근 3년간의 부담금 납입현황
   나. 급여종류별 표준적인 급여액 수준
   다. 직전 사업연도 말 기준 최소적립금 대비 적립금 현황
   라. 적립금이 최소적립금보다 적은 경우 그 부족분 납입 이행 상황
   마. 그 밖에 적립금 운용현황, 운용목표 등에 관한 사항
  3. 확정기여형퇴직연금제도의 설정에 따른 추가 교육사항
   가. 사용자의 부담금 수준, 납입시기 및 납입 현황
   나. 분산투자 등 적립금의 안정적 운용을 위하여 행하는 투자원칙에 관한 사항
   다. 퇴직연금사업자가 제시하는 집합투자증권 등 적립금 운용방법별 수익구조, 매도기준가, 투자 위험 및 수수료 등에 관한 사항
 ② 제1항에 따른 교육의 방법 및 절차에 관한 사항은 다음 각 호의 구분에 따른다.
  1. 제1항제1호의 제도 일반에 관한 교육사항은 사내 전산망 또는 해당 사업장 등 가입자의 접근이 가능한 곳에 교육 자료 상시 게시하여 가입자가 수시로 열람할 수 있도록 한다. 다만, 퇴직연금제도를 도입한 후 최초로 하는 교육은 다음 각 목 중 하나 이상의 방법으로 실시한다.
   가. 서면 또는 전자우편 등을 통한 교육자료의 발송
   나. 연수·회의·강의 등 집합교육의 실시
   다. 정보통신망을 활용한 온라인 교육의 실시
  2. 제1항제2호의 확정급여형퇴직연금 제도의 설정에 따른 추가 교육사항은 사내 전산망 또는 해당 사업장 등 가입자의 접근이 가능한 곳에 교육 자료 상시 게시하여 가입자가 수시로 열람할 수 있도록 하거나, 제1호 각 목의 어느 하나에 해당하는 방법으로 실시한다.
  3. 제1항제3호의 확정기여형퇴직연금제도의 설정에 따른 추가 교육사항은 제1호 각 목의 어느 하나에 해당하는 방법으로 실시한다.
 ③ 사용자는 퇴직연금사업자 또는 영 제32조의3에 따른 요건을 갖춘 전문기관(이하 "전문기관"이라 한다)에 제1항 및 제2항에 따른 교육의 실시를 위탁할 수 있다.
 ④ 제3항에 따라 퇴직연금사업자 또는 전문기관에 가입자 교육의 실시를 위탁하는 경우 사용자는 퇴직연금사업자 또는 전문기관과 교육시기, 교육내용, 구체적 교육방법 등을 포함한 계약을 체결하여 퇴직연금사업자 또는 전문기관으로 하여금 위탁계약의 내용에 따라 교육을 실시하도록 하여야 한다.
 ⑤ 사용자는 제3항 및 제4항에 따라 교육의 실시를 위탁한 경우 교육의 실시를 위하여 필요한 사항에 협조하고, 그 실시 결과를 확인하여야 한다.


제12장 기타

제45조(사업연도) 이 제도의 사업연도는 이 사업의 회계연도를 기준으로 하며, 회계 결산월은 ${h((d.fiscalMonth||"12")+"월")}로 한다.

제46조(규약의 변경) ① 사용자는 이 규약의 내용을 변경하고자 하는 경우에는 근로자대표의 의견을 들어야 한다. 다만, 근로자에게 불리하게 변경하려는 경우에는 근로자대표의 동의를 받아야 한다.
 ② 사용자는 제1항에 따른 규약의 변경 시 그 내용을 가입자에게 알려야 한다.
 ③ 사용자는 규약이 변경된 경우 그 내용을 퇴직연금사업자에게 통지하여야 한다.

제47조(법령 등의 준용) ① 이 규약에서 정하지 아니한 사항은 관련 법령 및 취업규칙 등에서 정한 바에 따른다.
 ② 이 규약에서 정한 사항을 관련 법령에서 변경한 경우에는 그에 따르기로 한다.


【부 칙 <${h(sf)}>】

${d.regulationType==="change"?`제1조(시행일) 이 제도는 ${h(sf)}부터 변경하여 시행한다. 다만, 관련 법령 개정에 따른 변경사항은 개정법령 시행일부터 적용한다.`:`제1조(시행일) 이 제도는 ${h(sf)}부터 시행한다.`}${convArt}

function generateSummary(d,planType) {
  const allOps=[...(d.operationManagers||[]),...(d.operationManagersBanks||[]),...(d.operationManagersIns||[])];
  const allAssets=[...(d.assetManagers||[]),...(d.assetManagersBanks||[]),...(d.assetManagersIns||[])];
  const covMap={all:"전체 근로자",specific_group:d.specificGroup||"특정 집단",after_date:"특정시점 이후 입사자",choice:"근로자 선택제"};
  const cycMap={monthly:"매월",quarterly:"매분기",yearly:"매년"};
  const base=[
    {section:"사업장",items:[{k:"회사명",v:d.companyName},{k:"사업자번호",v:d.bizNo},{k:"대표자",v:d.ceoName},{k:"업종",v:d.industry},{k:"상시근로자",v:(d.employeeCount||0)+"명"},{k:"주소",v:d.address}]},
  ];
  if(planType==="DC") base.push({section:"제도 설계",items:[
    {k:"가입대상",v:covMap[d.coverageType]||"전체 근로자"},{k:"임원 포함",v:d.includeExecutives?"포함":"제외"},
    {k:"1년 미만자",v:d.includeUnder1Year?"포함":"제외 (법 기본)"},{k:"15시간 미만자",v:d.includeUnder15Hour?"포함":"제외 (법 기본)"},
    {k:"부담금 수준",v:"연간 임금총액의 "+(d.contributionRate||"12분의 1")},{k:"납입 주기",v:cycMap[d.paymentCycle]||"매월"},
    {k:"과거근로기간",v:d.retroactive==="full"?"전부 소급":d.retroactive==="partial"?"일부 소급":"소급 없음"},
  ]});
  else if(planType==="DB") base.push({section:"제도 설계 (DB형)",items:[
    {k:"급여수준",v:d.benefitType==="progressive"?"누진율 적용":"법정 기본 (1년당 30일분 평균임금)"},
    {k:"임금피크 보전",v:d.wagepeakProtection?"별도 산정 기준 마련":"별도 규정 없음"},

  ]});
  else base.push({section:"제도 설계 (혼합형)",items:[
    {k:"DB 설정비율",v:(d.dbRatio||"-")+"%"},{k:"DC 설정비율",v:(d.dcRatio||"-")+"%"},
    {k:"가입대상",v:covMap[d.coverageType]||"전체 근로자"},{k:"임원 포함",v:d.includeExecutives?"포함":"제외"},
    {k:"1년 미만자",v:d.includeUnder1Year?"포함":"제외 (법 기본)"},{k:"15시간 미만자",v:d.includeUnder15Hour?"포함":"제외 (법 기본)"},
    {k:"임금피크 보전",v:d.wagepeakProtection?"별도 산정":"없음"},
    {k:"DC 부담금",v:"연간 임금총액의 "+(d.contributionRate||"12분의 1")},
    {k:"과거근로기간",v:d.retroactive==="full"?"전부 소급":d.retroactive==="partial"?"일부 소급":"소급 없음"},
  ]});
  if(planType==="HY"){
    const dbo=[...(d.dbOperationManagers||[]),...(d.dbOperationManagersBanks||[]),...(d.dbOperationManagersIns||[])];
    const dco=[...(d.dcOperationManagers||[]),...(d.dcOperationManagersBanks||[]),...(d.dcOperationManagersIns||[])];
    const dba=[...(d.dbAssetManagers||[]),...(d.dbAssetManagersBanks||[]),...(d.dbAssetManagersIns||[])];
    const dca=[...(d.dcAssetManagers||[]),...(d.dcAssetManagersBanks||[]),...(d.dcAssetManagersIns||[])];

      ...(dbo.length>1?[{k:"DB 간사기관",v:d.dbLeadProvider||"-"}]:[]),
      {k:"DC 운용관리기관",v:dco.join(", ")||"-"},{k:"DC 자산관리기관",v:dca.join(", ")||"-"},
    ]});
  } else {
    base.push({section:"퇴직연금사업자",items:[
      {k:"운용관리기관",v:allOps.join(", ")||"-"},{k:"자산관리기관",v:allAssets.join(", ")||"-"},
      ...(planType==="DB"&&allOps.length>1?[{k:"간사기관",v:d.leadProvider||"-"}]:[]),
    ]});
  }
  base.push({section:"운영 사항",items:[
    {k:d.regulationType==="change"?"규약 변경일":"제도 시행일",v:d.startDate||"-"},
    {k:"신고 유형",v:d.regulationType==="change"?"규약 변경":"신규 설정"},
    {k:"결산월",v:(d.fiscalMonth||"12")+"월"},

  ]});
  return base;
}

// ─── AI 챗봇 ───────────────────────────────────────
function ChatBot({regulation,data,planType}) {
  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const endRef=useRef(null);
  useEffect(()=>{if(endRef.current)endRef.current.scrollIntoView({behavior:"smooth"});},[messages]);
  const EXAMPLES=planType==="DC"?["중도인출 가능한 사유는?","부담금 지연이자는?","퇴직 시 IRP로 어떻게 이전돼?","사전지정운용방법이란?"]:["DB형에서 사용자 책임은?","임금피크제 시 급여는?","재정검증은 언제 해?","적립금 부족하면?"];
  const send=async(text)=>{
    if(!text.trim()||loading) return;
    const userMsg={role:"user",content:text.trim()};
    setMessages(p=>[...p,userMsg]); setInput(""); setLoading(true);
    try {
      const tmp=document.createElement("div");tmp.innerHTML=regulation;
      const regText=tmp.textContent||tmp.innerText||"";
      const sysPrompt=`당신은 ${planType}형 퇴직연금 규약 전문 상담 AI입니다.\n\n답변 규칙:\n1. 반드시 규약 조문 번호를 인용 (예: "제15조에 따르면...")\n2. 규약에 없는 내용은 "이 규약에 명시되어 있지 않습니다"\n3. 핵심만 간결하게 3-5문장\n\n=== 규약 전문 ===\n${regText}`;
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:sysPrompt,messages:[...messages,userMsg].map(m=>({role:m.role,content:m.content}))}),
      });
      const result=await res.json();
      const text=result.content?result.content.filter(c=>c.type==="text").map(c=>c.text).join(""):"응답을 생성할 수 없었습니다.";
      setMessages(p=>[...p,{role:"assistant",content:text}]);
    } catch(err) {
      setMessages(p=>[...p,{role:"assistant",content:"AI 규약 상담 어시스턴트는 추후 연동 예정입니다. 현재는 '자주 묻는 질문' 탭을 이용해주세요."}]);
    }
    setLoading(false);
  };
  return (<div style={{display:"flex",flexDirection:"column",height:460}}>
    {messages.length===0&&<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flex:1,padding:"30px 16px",textAlign:"center"}}>
      <div style={{fontSize:28,marginBottom:8}}>🤖</div>
      <p style={{fontSize:14,fontWeight:700,color:"#5A2800",margin:"0 0 6px"}}>{data.companyName} 규약 AI 상담</p>
      <p style={{fontSize:12,color:"#6b7280",margin:"0 0 14px"}}>AI 규약 상담 어시스턴트는 추후 연동 예정입니다. 현재는 '자주 묻는 질문' 탭을 이용해주세요.</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center"}}>
        {EXAMPLES.map((ex,i)=><button key={i} style={{padding:"7px 14px",fontSize:11.5,fontWeight:500,background:"#f3f4f6",border:"1px solid #e5e7eb",borderRadius:20,color:"#4b5563",cursor:"pointer"}} onClick={()=>send(ex)}>{ex}</button>)}
      </div>
    </div>}
    <div style={{flex:1,overflowY:"auto",padding:"12px 0"}}>
      {messages.map((m,i)=><div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",marginBottom:10,padding:"0 4px"}}>
        <div style={m.role==="user"?{maxWidth:"75%",padding:"9px 14px",borderRadius:"16px 16px 4px 16px",background:"#5A2800",color:"#fff",fontSize:13,lineHeight:1.6}:{maxWidth:"80%",padding:"9px 14px",borderRadius:"16px 16px 16px 4px",background:"#f3f4f6",color:"#1f2937",fontSize:13,lineHeight:1.6}}>
          {m.content.split("\n").map((line,j)=><p key={j} style={{margin:j>0?"6px 0 0":0}}>{line}</p>)}
        </div>
      </div>)}
      {loading&&<div style={{display:"flex",justifyContent:"flex-start",padding:"0 4px"}}><div style={{padding:"9px 14px",borderRadius:"16px 16px 16px 4px",background:"#f3f4f6",fontSize:12.5,color:"#9ca3af",fontStyle:"italic"}}>규약을 분석하고 있습니다...</div></div>}
      <div ref={endRef} />
    </div>
    <div style={{display:"flex",gap:8,padding:"10px 0 0",borderTop:"1px solid #e5e7eb"}}>
      <input style={{flex:1,padding:"10px 14px",fontSize:13,border:"1.5px solid #d1d5db",borderRadius:20,outline:"none"}} placeholder="규약에 대해 질문하세요..." value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(input);}}} disabled={loading} />
      <button style={{padding:"8px 18px",borderRadius:20,fontSize:13,fontWeight:600,border:"none",background:"#5A2800",color:"#fff",cursor:"pointer",flexShrink:0,opacity:input.trim()&&!loading?1:0.4}} onClick={()=>send(input)} disabled={!input.trim()||loading}>전송</button>
    </div>
  </div>);
}

// ─── 신고서 Word 파일 생성 ──────────────────────────
function generateSingoWord(data, planType) {

  const borders = { top: bdr, bottom: bdr, left: bdr, right: bdr };
  const mg = { top: 40, bottom: 40, left: 100, right: 100 };

  function cell(text, width, opts = {}) {
    const paras = [];
    const textStr = text || "";
    textStr.split("\n").forEach(line => {
